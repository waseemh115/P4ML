<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Burak Health — Clinical Nursing Simulator v2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:root{
  --navy:#0B1F3A;--navy2:#1A3A6B;--navyd:#0D2A40;
  --teal:#0D6B5E;--tealm:#14B8A6;--teall:#E8F8F5;
  --white:#fff;--off:#F4F6F9;--border:#DDE2E9;
  --ink:#0F172A;--slate:#4A5568;--muted:#8A96A8;
  --green:#1A7F54;--greenl:#E6F6EE;
  --red:#C53030;--redl:#FEF0F0;
  --amber:#B7791F;--amberl:#FFFBEB;
  --blue:#1A56DB;--bluel:#EBF4FF;
  --purp:#6B21A8
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;color:var(--ink);background:var(--off)}

/* LOGIN */
.login-page{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:20px}
.brand-mark{display:flex;align-items:center;gap:11px;margin-bottom:28px}
.bm-b{width:42px;height:42px;background:var(--teal);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:19px}
.bm-name{color:#fff;font-size:12px;font-weight:700;letter-spacing:3px}
.bm-sub{color:var(--muted);font-size:10px;letter-spacing:1px}
.login-card{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:520px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.lc-eyebrow{font-size:11px;font-weight:700;color:var(--tealm);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
.lc-title{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:4px}
.lc-sub{font-size:13px;color:var(--slate);line-height:1.6;margin-bottom:22px}
.lc-lbl{font-size:12px;font-weight:600;color:var(--slate);margin-bottom:8px;display:block}
.lc-inp{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;margin-bottom:18px;transition:border-color .15s}
.lc-inp:focus{border-color:var(--tealm)}
.lc-inp::placeholder{color:var(--muted)}
.dept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.dept-card{border:2px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;background:#fff;text-align:center}
.dept-card:hover{border-color:var(--tealm)}
.dept-card.sel{border-color:var(--teal);background:var(--teall)}
.dept-card.sel .dc-n{color:var(--teal)}
.dc-i{font-size:26px;margin-bottom:8px;line-height:1}
.dc-n{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:3px}
.dc-s{font-size:10px;color:var(--muted);line-height:1.4}
.lc-btn{width:100%;padding:12px;border-radius:8px;border:none;background:var(--teal);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.lc-btn:disabled{opacity:.35;cursor:not-allowed}
.lc-btn:not(:disabled):hover{opacity:.9}

/* SHELL */
.app-shell{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sys-bar{display:none}
.sb-b{width:22px;height:22px;background:var(--teal);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:10px}
.sb-name{color:#fff;font-size:10px;font-weight:700;letter-spacing:2px}
.sb-pipe{width:1px;height:18px;background:var(--navy2);flex-shrink:0}
.sb-user{color:#94A3B8;font-size:11px;white-space:nowrap}
.sb-role{color:var(--tealm);font-size:10px;font-weight:600;margin-left:4px}
.sb-ptinfo{color:#94A3B8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-score{background:rgba(20,184,166,.15);border:1px solid var(--tealm);border-radius:4px;padding:2px 10px;display:flex;align-items:center;gap:5px;flex-shrink:0}
.sw-n{color:var(--tealm);font-size:13px;font-weight:900}
.sw-l{color:#94A3B8;font-size:9px;font-weight:700}
.sb-exit{background:none;border:1px solid var(--navy2);border-radius:4px;color:#94A3B8;font-size:10px;padding:3px 8px;cursor:pointer;font-family:inherit;flex-shrink:0}
.sb-exit:hover{color:#fff;border-color:#94A3B8}

/* PT BAR */
.pt-bar{height:42px;background:var(--navyd);border-bottom:2px solid var(--tealm);display:flex;align-items:center;padding:0 16px;gap:0;flex-shrink:0;overflow-x:auto}
.pb-seg{padding:0 14px;border-right:1px solid var(--navy2);flex-shrink:0}
.pb-seg:first-child{padding-left:0}
.pb-k{font-size:9px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px;margin-bottom:1px}
.pb-v{font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.pb-allergy{margin-left:auto;background:#4A0000;border:1px solid #9B1C1C;border-radius:4px;padding:3px 10px;flex-shrink:0}
.pb-ak{font-size:9px;color:#FCA5A5;font-weight:700}
.pb-av{font-size:11px;color:#FEE2E2;font-weight:700}

/* STEPPER */
.stepper-wrap{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;flex-shrink:0}
.stepper{display:flex;align-items:center;padding:12px 0;overflow-x:auto;gap:0}
.step-item{display:flex;align-items:center;flex-shrink:0}
.step-node{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:80px;cursor:pointer}
.step-node:not(.s-active):not(.s-done){opacity:.45}
.step-circle{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);background:#fff;transition:all .2s}
.s-active .step-circle{border-color:var(--teal);background:var(--teal);color:#fff}
.s-done .step-circle{border-color:var(--green);background:var(--green);color:#fff;font-size:13px}
.step-label{font-size:10px;font-weight:600;color:var(--muted);text-align:center;line-height:1.3;max-width:75px}
.s-active .step-label{color:var(--teal);font-weight:700}
.s-done .step-label{color:var(--green)}
.step-connector{flex:1;height:2px;background:var(--border);min-width:20px;max-width:44px;margin:0 4px;margin-top:-14px}
.step-connector.done-c{background:var(--green)}

/* CONTENT */
.content-area{flex:1;overflow-y:auto;padding:22px}
.content-inner{max-width:1100px;margin:0 auto}
.stage-hdr{margin-bottom:18px}
.stage-eyebrow{font-size:10px;font-weight:700;color:var(--tealm);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px}
.stage-title{font-size:21px;font-weight:800;color:var(--ink);margin-bottom:4px}
.stage-desc{font-size:13px;color:var(--slate);line-height:1.6}
.who-badge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;margin-top:8px}
.who-n{background:var(--teall);color:var(--teal);border:1px solid rgba(13,107,94,.2)}
.who-d{background:var(--bluel);color:var(--blue);border:1px solid rgba(26,86,219,.2)}

/* CARD */
.card{background:#fff;border-radius:11px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
.card-hdr{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.card-title{font-size:14px;font-weight:700;color:var(--ink)}
.card-sub{font-size:11px;color:var(--muted);margin-top:1px}
.card-body{padding:16px}

/* FIELDS */
.field-row{display:grid;gap:13px;margin-bottom:13px}
.fr-2{grid-template-columns:1fr 1fr}
.fr-3{grid-template-columns:1fr 1fr 1fr}
.fld-lbl{font-size:11px;font-weight:700;color:var(--slate);margin-bottom:5px;display:block}
.fld-inp{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;transition:border-color .15s;background:#fff}
.fld-inp:focus{border-color:var(--tealm)}
.fld-inp:disabled{background:var(--off);color:var(--slate)}
.fld-inp::placeholder{color:var(--muted)}
.fld-sel{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
.fld-sel:focus{border-color:var(--tealm)}

/* VITALS */
.vitals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}
.vital-card{background:var(--off);border-radius:9px;padding:11px;border:1.5px solid var(--border)}
.vital-card:focus-within{border-color:var(--tealm);background:#fff}
.vc-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.vc-unit{font-size:10px;color:var(--muted);font-weight:400}
.vc-inp{width:100%;border:none;background:transparent;font-size:20px;font-weight:800;color:var(--ink);font-family:inherit;outline:none;padding:3px 0}

/* NEWS2 */
.n2-bar{background:var(--navy);border-radius:9px;padding:14px 18px;display:flex;align-items:center;gap:20px}
.n2-num{font-size:46px;font-weight:900;color:#fff;line-height:1}
.n2-sep{width:1px;background:var(--navy2);align-self:stretch}
.n2-body{flex:1}
.n2-sublbl{font-size:9px;color:#64748B;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.n2-status{font-size:15px;font-weight:700}
.n2-action{font-size:12px;color:#94A3B8;margin-top:3px;line-height:1.4}

/* TRIAGE */
.triage-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:13px}
.triage-opt{border:2px solid var(--border);border-radius:9px;padding:13px;cursor:pointer;transition:all .15s;background:#fff}
.triage-opt:hover{border-color:var(--tealm)}
.triage-opt.sel{border-color:var(--teal);background:var(--teall)}
.to-name{font-size:13px;font-weight:700;color:var(--ink)}
.to-sub{font-size:11px;color:var(--muted);margin-top:2px}
.triage-opt.sel .to-name{color:var(--teal)}

/* TICK ROWS */
.tick-row{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;border-radius:9px;border:1.5px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .15s;background:#fff}
.tick-row:hover{border-color:var(--tealm)}
.tick-row.ticked{border-color:var(--green);background:var(--greenl)}
.tick-box{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:0}
.tick-row.ticked .tick-box{background:var(--green);border-color:var(--green);color:#fff;font-size:12px;font-weight:700}
.tick-row.ticked .tick-box::after{content:'✓'}
.tick-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px}
.tick-sub{font-size:11px;color:var(--slate);line-height:1.5}

/* SOAP */
.soap-field{margin-bottom:13px}
.soap-key{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:5px;color:#fff;font-size:11px;font-weight:700;margin-right:6px;vertical-align:middle}
.soap-lbl{font-size:12px;font-weight:700;color:var(--ink)}
.soap-hint{font-size:11px;color:var(--muted);margin:3px 0 5px 29px;line-height:1.4}
.soap-ta{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;resize:vertical;min-height:68px;outline:none;color:var(--ink);line-height:1.5;transition:border-color .15s}
.soap-ta:focus{border-color:var(--teal)}

/* MAR */
.mar-tbl{width:100%;border-collapse:collapse}
.mar-tbl th{padding:8px 12px;font-size:10px;font-weight:700;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.5px}
.mar-tbl td{padding:10px 12px;border-bottom:1px solid var(--off);font-size:12px;vertical-align:middle}
.mar-tbl tr:last-child td{border-bottom:none}
.adm-btn{background:var(--teal);color:#fff;border:none;border-radius:5px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.adm-done{color:var(--green);font-size:10px;font-weight:700}
.high-risk-tag{background:var(--redl);color:var(--red);border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;margin-left:5px}

/* CALLOUT */
.callout{border-radius:8px;padding:11px 14px;margin-bottom:13px;display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.6}
.c-info{background:var(--bluel);border-left:3px solid var(--blue);color:#1E40AF}
.c-warn{background:var(--amberl);border-left:3px solid var(--amber);color:#92400E}
.c-ok{background:var(--greenl);border-left:3px solid var(--green);color:#14532D}
.c-icon{font-size:15px;flex-shrink:0;margin-top:1px}

/* NAV */
.nav-bar{background:#fff;border-top:1px solid var(--border);padding:13px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-back{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;font-family:inherit}
.nav-back:hover{background:var(--off)}
.nav-next{background:var(--teal);border:none;border-radius:8px;padding:10px 22px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}
.nav-next:hover:not(:disabled){opacity:.9}
.nav-next:disabled{opacity:.32;cursor:not-allowed}
.nav-info{font-size:12px;color:var(--muted)}

/* DONE */
.done-screen{text-align:center;padding:36px 20px}
.done-icon{font-size:52px;margin-bottom:14px;line-height:1}
.done-title{font-size:24px;font-weight:900;color:var(--ink);margin-bottom:7px}
.done-sub{font-size:13px;color:var(--slate);margin-bottom:22px;line-height:1.6}
.score-row{display:flex;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sr-card{background:var(--off);border-radius:9px;padding:12px 20px;text-align:center;border:1px solid var(--border)}
.sr-n{font-size:22px;font-weight:900;color:var(--teal)}
.sr-l{font-size:10px;color:var(--muted);margin-top:2px}
.done-cert{background:var(--navy);border-radius:11px;padding:16px;max-width:380px;margin:0 auto 20px}
.dc-lbl{color:var(--tealm);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.dc-name{color:#fff;font-size:18px;font-weight:800;margin-bottom:2px}
.dc-sub{color:#94A3B8;font-size:11px}
.restart-btn{background:var(--teal);border:none;border-radius:8px;padding:11px 26px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;margin:0 5px}

/* PATIENT LIST */
.pt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pt-card{background:#fff;border-radius:10px;border:2px solid var(--border);padding:14px;cursor:pointer;transition:all .15s;position:relative}
.pt-card:hover{border-color:var(--tealm)}
.pt-card.sel{border-color:var(--teal)}
.pt-avatar{width:40px;height:40px;border-radius:50%;background:var(--teall);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

/* BADGE */
.badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700}
.b-new{background:var(--bluel);color:var(--blue)}
.b-cont{background:var(--greenl);color:var(--green)}
.b-done{background:var(--off);color:var(--muted)}
.b-pend{background:var(--bluel);color:var(--blue)}

/* ED TABLE */
.ed-tbl{width:100%;border-collapse:collapse}
.ed-tbl th{padding:9px 12px;font-size:10px;font-weight:700;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.4px;background:var(--off)}
.ed-tbl td{padding:10px 12px;border-bottom:1px solid var(--off);font-size:12px;vertical-align:middle}
.ed-tbl tr.sel-row{background:var(--bluel)}
.begin-btn{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.sel-btn{background:none;border:1.5px solid var(--border);border-radius:6px;padding:6px 12px;font-size:11px;color:var(--slate);cursor:pointer;font-family:inherit}

[data-tip]{position:relative;cursor:help}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#1A1A2E;color:#fff;padding:7px 11px;border-radius:6px;font-size:11px;line-height:1.5;white-space:pre-line;min-width:170px;max-width:260px;z-index:3000;box-shadow:0 4px 18px rgba(0,0,0,.3);pointer-events:none}
[data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1A1A2E;z-index:3001;pointer-events:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.cs-menu{width:220px;flex-shrink:0;background:#F8FAFC;border-right:2px solid #F1F5F9;overflow-y:auto;display:flex;flex-direction:column}.cs-menu-hdr{padding:16px;border-bottom:1.5px solid #F1F5F9;background:#fff;flex-shrink:0}.cs-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-left:3px solid transparent;transition:all .12s;font-size:12px;font-weight:500;color:#475569;border-bottom:1px solid #F8FAFC;position:relative}.cs-item:hover{background:#F0FDF9;color:#0D6B5E}.cs-item.act{background:#E8F8F5;border-left-color:#14B8A6;color:#0D6B5E;font-weight:700}.cs-content{flex:1;overflow-y:auto;padding:18px 20px;background:#fff;font-size:13px;color:#0F172A;line-height:1.6}.cs-sidebar{width:230px;flex-shrink:0;border-left:1.5px solid #F1F5F9;background:#FAFBFC;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th{padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#FAFBFC;border-bottom:1px solid var(--border)}.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;display:inline-block}.bc{background:var(--greenl);color:var(--green)}.bp{background:var(--amberl);color:var(--amber)}.bd{background:var(--redl);color:var(--red)}.fH{background:var(--redl);color:var(--red);font-weight:700;padding:2px 6px;border-radius:3px}.fL{background:var(--bluel);color:var(--blue);font-weight:700;padding:2px 6px;border-radius:3px}.fN{background:var(--greenl);color:var(--green);font-weight:700;padding:2px 6px;border-radius:3px}.cal{display:flex;gap:10px;padding:12px 14px;border-radius:9px;margin-bottom:10px;font-size:12px;line-height:1.6}.cwarn{background:var(--amberl);border:1px solid rgba(217,119,6,.2)}.cinfo{background:var(--bluel);border:1px solid rgba(26,86,219,.15)}.modal-overlay{position:fixed;inset:0;ba function startPSI(){
S.simStart=Date.now();S.elapsed=0;S.alog=[];
if(S.psiIv)clearInterval(S.psiIv);
S.psiIv=setInterval(function(){
if(S.view!=='app')return;
S.elapsed=Math.floor((Date.now()-S.simStart)/1000);
var sid=STEPS[S.step];
var decay=S.dept==='ed'?0.18:S.dept==='ip'?0.08:0.03;
if(sid==='orders'||sid==='pyxis')decay*=1.5;
S.psi=Math.max(8,S.psi-decay);
var en=document.getElementById('psin');if(en)en.textContent=Math.round(S.psi);
var ef=document.getElementById('psif');if(ef){ef.style.width=S.psi+'%';ef.style.background=psiC(S.psi);}
var ew=document.getElementById('psiw');if(ew){ew.style.borderColor=psiC(S.psi)+'66';ew.style.background=psiC(S.psi)+'11';}
var el=document.getElementById('psil');if(el){el.textContent=psiL(S.psi);el.style.color=psiC(S.psi);}
updStats();
var ec=document.getElementById('edclk');if(ec)ec.textContent=new Date().toLocaleTimeString();
if(S.dept==='ed'&&!S.disruption&&S.elapsed>0&&S.elapsed%53===0)trigDisrupt();
},1000);
}

function getScore(){
var s=0,sc2=S.activeSc;if(!sc2)return 0;
if(S.vitals.rr)s+=12;
var tasks=TASKS(S.dept||'ip',calcN2(S.vitals.rr?S.vitals:(sc2.vitals||S.vitals)));
s+=Math.round(tasks.filter(function(t){return S.pcTasks&&(S.pcTasks||{})[t.id];}).length*(18/Math.max(tasks.length,1)));
s+=Math.min((sc2.orders||[]).filter(function(_,i){return (S.ordersDone||{})['o'+i];}).length*4,20);
var sp=S.soap||{S:"",O:"",A:"",P:""};if(sp.S&&sp.S.length>15)s+=16;
s+=Math.min((sc2.mar||[]).filter(function(_,i){return (S.marDone||{})['m'+i];}).length*8,22);
var h=S.hov;if(h.S&&h.S.length>15)s+=10;
return Math.min(Math.round(s),100);
}

function updStats(){
Object.keys(S.statTimers||{}).forEach(function(k){
var t=S.statTimers[k],el=document.getElementById('st-'+k);if(!el)return;
var elapsed=Math.floor((Date.now()-t.start)/1000),remain=t.target-elapsed;
if(S.ordersDone[t.ord]){el.className='stmr tok';el.textContent='Done: '+t.label;return;}
var m=Math.floor(Math.abs(remain)/60),s=Math.abs(remain)%60;
var str=(remain<0?'-':'')+m+':'+(s<10?'0':'')+s;
if(remain>120){el.className='stmr tok';el.textContent=t.label+' '+str;}
else if(remain>0){el.className='stmr twarn';el.textContent=t.label+' WARNING '+str;}
else{el.className='stmr tlate';el.textContent=t.label+' OVERDUE';}
});
}

function pcCascadeStep(){
  if(!S.pcCascade)S.pcCascade={ordersRead:false,labsAck:false,pharmAck:false,imagingAck:false,deptAck:false};
  var c=S.pcCascade;
  var tasks=TASKS(S.dept,calcN2(S.vitals.rr?S.vitals:sc().vitals));
  var allTasksDone=tasks.length>0&&tasks.every(function(t){return (S.pcTasks||{})[t.id];});
  if(!c.ordersRead)return 0;
  if(!allTasksDone)return 1;
  if(!c.labsAck)return 2;
  if(!c.pharmAck)return 3;
  if(!c.imagingAck)return 4;
  return 5;
}
function canProceed(){
  var sid=STEPS[S.step],sc2=sc();if(!S.activeSc)return false;
  if(sid==='checkin')return !!(S.checkin.first&&S.checkin.last&&S.checkin.dob);
  if(sid==='triage')return !!(S.triage.category&&S.triage.pain);
  if(sid==='vitals')return !!(S.vitals.rr);
  if(sid==='powerchart'){
    var c=S.pcCascade||{};if(!c.ordersRead)return false;
    var t=TASKS(S.dept,calcN2(S.vitals.rr?S.vitals:(sc2.vitals||S.vitals)));
    if(!t.every(function(x){return S.pcTasks&&S.pcTasks[x.id];}))return false;
    return !!(c.labsAck&&c.pharmAck&&c.imagingAck&&c.deptAck);
  }
  if(sid==='orders'){
    var ordsDone=(sc2.orders||[]).every(function(_,i){return (S.ordersDone||{})['o'+i];});
    return ordsDone;
  }
  if(sid==='soap'){var sp=S.soap;return !!(sp.S&&sp.O&&sp.A&&sp.P);}
  if(sid==='pyxis')return (sc2.mar||[]).filter(function(m){return m.due!=='PRN';}).every(function(m,i){return (S.marDone||{})['m'+i];});
  if(sid==='handover'){
    if(S.dept==='ed'&&!S.disposition)return false;
    var hv=S.hov;return !!(hv.S&&hv.B&&hv.A&&hv.R);
  }
  return true;
}

function getMissingHint(){

    if(!S.checkin.first||!S.checkin.last)return {field:'Patient name',msg:'Enter first and last name to register the patient.',id:'ci-first',tab:null};
    if(!S.checkin.dob)return {field:'Date of birth',msg:'Date of birth is the second patient identifier. Mandatory at every JCI institution.',id:'ci-dob',tab:null};
  }
  if(sid==='triage'){
    if(!S.triage.category)return {field:'Triage category',msg:'Select a triage category — this determines clinical priority.',id:'tri-cat',tab:null};
    if(!S.triage.pain)return {field:'Pain score',msg:'Document the pain score (NRS 0-10). Legally required at every JCI institution.',id:'tri-pain',tab:null};
  }
  if(sid==='vitals'){
    if(!S.vitals.rr)return {field:'Respiratory rate',msg:'Respiratory rate is the most sensitive early warning sign. Required for NEWS2.',id:'vf-rr',tab:null};
    if(!S.vitals.spo2)return {field:'SpO\u2082',msg:'Oxygen saturation required for NEWS2.',id:'vf-spo2',tab:null};
    if(!S.vitals.hr)return {field:'Heart rate',msg:'Heart rate required for NEWS2.',id:'vf-hr',tab:null};
  }
  if(sid==='powerchart'){
    var c2=S.pcCascade||{};
    if(!c2.ordersRead)return {field:'Doctor Orders \u2014 complete first',msg:'Read all physician orders and tap the confirmation button before starting nursing tasks.',id:null,tab:'docorders'};
    var tasks=TASKS(S.dept,calcN2(S.vitals));
    var missing=tasks.filter(function(t){return !(S.pcTasks||{})[t.id];});
    if(missing.length){
      var t=missing[0];var idx=tasks.indexOf(t);
      /* Special case: allergy check must always be first */
      if(t.id==='t0'){
        if(!c2.ordersRead)return {field:'Read Doctor Orders first',msg:'Before the Allergy Safety Check, read and acknowledge the doctor orders. Orders must be read before any nursing task.',id:null,tab:'docorders'};
        return {field:'Allergy Safety Check — complete this first',msg:'Verify the patient wristband matches the Burak Chart allergy record. This must be done before any medication.',id:'trow-t0',tab:'tasks'};
      }
      if(idx>0&&!(S.pcTasks||{})[tasks[idx-1].id])return {field:'Task '+(idx)+' must come first',msg:'Complete \"'+tasks[idx-1].lbl.substring(0,40)+'…\" before this one.',id:'trow-'+tasks[idx-1].id,tab:'tasks'};
      return {field:'Task '+(idx+1)+' \u2014 '+t.lbl.substring(0,35)+'…',msg:missing.length+' task'+(missing.length>1?'s':'')+' remaining. Tap \"Take me there\" to jump to it.',id:'trow-'+t.id,tab:'tasks'};
    }
    if(!c2.labsAck)return {field:'Lab Results \u2014 acknowledge',msg:'Review all lab results, communicate critical values, then tap Acknowledge.',id:null,tab:'labs'};
    if(!c2.pharmAck)return {field:'Pharmacy \u2014 review required',msg:'Review the dispensing queue, then tap Pharmacy reviewed.',id:null,tab:'pharmacy'};
    if(!c2.imagingAck)return {field:'Imaging \u2014 acknowledge',msg:'Review imaging results, then tap Imaging reviewed.',id:null,tab:'imaging'};
    if(!c2.deptAck){var dTab=S.dept==='ed'?'etriage':S.dept==='ip'?'referral':'eduplan';return {field:'Complete the department form',msg:'Complete the final documentation step.',id:null,tab:dTab};}
  }
  if(sid==='soap'){
    if(!S.soap.S)return {field:'Subjective',msg:'Document what the patient tells you.',id:'soap-S',tab:null};
    if(!S.soap.O)return {field:'Objective',msg:'Document your observations.',id:'soap-O',tab:null};
    if(!S.soap.A)return {field:'Assessment',msg:'State your nursing assessment.',id:'soap-A',tab:null};
    if(!S.soap.P)return {field:'Plan',msg:'Document agreed plan and escalations.',id:'soap-P',tab:null};
  }
  if(sid==='handover'){
    if(S.dept==='ed'&&!S.disposition)return {field:'Disposition',msg:'Select patient disposition.',id:null,tab:null};
    if(!S.hov.S)return {field:'SBAR \u2014 Situation',msg:'State who you are and the clinical situation.',id:'hov-S',tab:null};
    if(!S.hov.B)return {field:'SBAR \u2014 Background',msg:'Document history and current status.',id:'hov-B',tab:null};
    if(!S.hov.A)return {field:'SBAR \u2014 Assessment',msg:'State your concern specifically.',id:'hov-A',tab:null};
    if(!S.hov.R)return {field:'SBAR \u2014 Recommendation',msg:'State clearly what you need.',id:'hov-R',tab:null};
  }
  return {field:'Incomplete',msg:'Please complete all required fields.',id:null,tab:null};
}

function togTask(id){
  var tasks=TASKS(S.dept,calcN2(S.vitals.rr?S.vitals:sc().vitals));
  var idx=-1;for(var fi=0;fi<tasks.length;fi++){if(tasks[fi].id===id){idx=fi;break;}}
  if(idx<0)return;
  if(!S.pcTasks||!(S.pcTasks||{})[id]){
    for(var i=0;i<idx;i++){
      if(!S.pcTasks||!(S.pcTasks||{})[tasks[i].id]){

        return;
      }
    }
  }
  if(!S.pcTasks)S.pcTasks={};(S.pcTasks||{})[id]=!(S.pcTasks||{})[id];
  var done=(S.pcTasks||{})[id];
  if(done){
    boostPSI(1);logA('Task completed','Nursing task documented','ok');
    var blocked=checkTriggers(id);
    if(blocked&&S.blockMsg){showBlock();return;}
    var t2=tasks[idx];if(t2.jingle)showJingle(t2.jingle,idx+1,tasks.length);
    if(tasks.every(function(t3){return (S.pcTasks||{})[t3.id];})){
      setTimeout(function(){showJingle({title:'All tasks complete \u2705',icon:'\u2705',color:'var(--green)',msg:'Every nursing task documented. Now work through the remaining cascade steps.',why:'Complete documentation protects the patient and the nurse.'},tasks.length,tasks.length);},400);
    }
  }
  tasks.forEach(function(t4,i){
    var row=document.getElementById('trow-'+t4.id);var box=document.getElementById('tbox-'+t4.id);
    var d2=(S.pcTasks||{})[t4.id];var locked2=i>0&&!S.pcTasks[tasks[i-1].id]&&!d2;
    if(row){row.style.background=d2?'var(--greenl)':locked2?'#FAFAFA':'#fff';row.style.borderColor=d2?'var(--green)':locked2?'rgba(0,0,0,.08)':'var(--border)';row.style.opacity=locked2?'0.5':'1';}
    if(box){box.style.background=d2?'var(--green)':'#fff';box.style.borderColor=d2?'var(--green)':'var(--border)';box.textContent=d2?'\u2713':'';}
  });
  var allD=tasks.every(function(t5){return (S.pcTasks||{})[t5.id];});
  var td2=tasks.filter(function(t6){return (S.pcTasks||{})[t6.id];}).length;
  var pct2=Math.round(td2/Math.max(tasks.length,1)*100);
  var ring=document.getElementById('task-ring');
  if(ring){var circ=2*Math.PI*28;ring.setAttribute('stroke-dasharray',(circ*pct2/100)+' '+(circ*(1-pct2/100)));ring.setAttribute('stroke',allD?'var(--green)':'var(--teal)');}
  var rp=document.getElementById('task-pct');if(rp){rp.textContent=pct2+'%';rp.style.color=allD?'var(--green)':'var(--teal)';}

function checkTriggers(taskId){
  var sc2=sc(),n2=calcN2(S.vitals.rr?S.vitals:(sc2.vitals||S.vitals));
  /* Blood cultures before antibiotics */
  if(taskId==='t2'&&S.dept==='ip')S.triggers.abxBeforeCx=true;
  var isAbx=(taskId==='t3'||taskId==='t4')&&S.dept==='ip';
  if(isAbx&&!S.triggers.abxBeforeCx&&!S.pcTasks['t2']){
    S.blockMsg={msg:'Antibiotics BEFORE blood cultures reduces culture yield by 40%. This is a patient safety violation.',taskId:'t2',taskLabel:'Task 2 \u2014 Collect blood cultures x2 BEFORE antibiotics'};
    S.pcTasks[taskId]=false;S.psi=Math.max(8,S.psi-12);return true;
  }
  /* Allergy check before medications */
  if((taskId==='t5'||taskId==='t4'||taskId==='t6')&&S.dept==='ed'&&S.triggers&&!S.triggers.allergyOk){
    S.blockMsg={msg:'Verify allergy status before ANY medication. Undocumented allergy causing anaphylaxis is a Never Event.',taskId:'t10',taskLabel:'Allergy Safety Check \u2014 verify wristband and Burak Chart record'};
    S.pcTasks[taskId]=false;S.psi=Math.max(8,S.psi-8);return true;
  }
  /* Allergy wristband done */
  if(taskId==='t10'||taskId==='t7'){if(S.triggers)S.triggers.allergyOk=true;showToast('\u2705 Allergy verified and documented.','#1A7F54');boostPSI(3);}
  /* Blood culture + O2 + ABx = sepsis bundle */
  if(S.dept==='ip'&&S.triggers&&S.triggers.abxBeforeCx&&S.pcTasks['t2']&&S.pcTasks['t3']&&!S.trigFired['sepsisBundle']){
    S.trigFired['sepsisBundle']=true;boostPSI(5);
    showToast('\u2705 SEPSIS HOUR-1 BUNDLE: Blood cultures \u2713 O2 \u2713 Protocol met.','#0D6B5E');
  }
  /* NEWS2 reward */
  if((taskId==='t4'||taskId==='t6')&&n2>0&&n2<5&&!S.trigFired['news2Calc']){
    S.trigFired['news2Calc']=true;boostPSI(2);
    showToast('\uD83D\uDCCA NEWS2 '+n2+' \u2014 '+(n2<=2?'Low. Continue 4-hourly obs.':n2<=4?'Medium. Increase to 2-hourly obs.':'High. Escalate.'),'#0D6B5E');
  }
  /* Controlled drug */
  if(taskId==='t5'&&S.dept==='ed'&&!S.trigFired['cdCheck']){
    S.trigFired['cdCheck']=true;
    showToast('\uD83D\uDD10 Morphine is a Controlled Drug. Two-nurse check MANDATORY.','#5B21B6');
  }
  /* OPD SBP flag */
  if(taskId==='t2'&&S.dept==='opd'&&S.vitals&&parseFloat(S.vitals.sbp)>160&&!S.trigFired['bpHigh']){
    S.trigFired['bpHigh']=true;
    showToast('\u26A0\uFE0F SBP '+S.vitals.sbp+'mmHg \u2014 hypertensive. Repeat in 5 min before reporting.','#B7791F');
  }
  return false;
}

    :'CAP with T2DM. CXR done. FBC, U&E, CRP, blood cultures ×2 before antibiotics. O₂ titrate 94-98%. IV access 18G. IV Co-Amoxiclav 1.2g q8h — <span style="color:#DC2626;font-weight:700">CHECK PENICILLIN ALLERGY FIRST.</span> Sliding scale insulin. NEWS2 q2h.';

  /* ── NURSING RESPONSIBILITIES (dept-specific teaching) ────────────── */
  var nurseSteps=isED?[
    {icon:'⚡',col:'#DC2626',t:'12-lead ECG within 10 minutes of arrival',w:'Door-to-ECG is the primary JCI quality indicator for STEMI/NSTEMI. Every minute of delay = myocardium lost. Print and hand to physician immediately.'},

    {icon:'🛡️',col:'#0891B2',t:'Verify allergy wristband before any medication',w:'Allergy status determines which antiplatelet is safe. Aspirin is contraindicated in NSAID allergy. Ticagrelor in severe hepatic impairment. Never assume — ask patient directly, check wristband, check Burak Chart.'},
    {icon:'❤️',col:'#EF4444',t:'Confirm continuous 3-lead monitoring is active',w:'NSTEMI carries risk of VF/VT in the first hour. Defibrillator must be at bedside. Print rhythm strip every 30 minutes or with any symptom change. Rhythm changes = immediate physician notification.'}

    {icon:'🩺',col:'#3B82F6',t:'Postural BP: sitting then standing at 1 minute',w:'ACE inhibitor dose titration risks postural hypotension, especially in elderly or dehydrated patients. Drop >20mmHg systolic or >10mmHg diastolic = do not uptitrate today. Document both readings.'},
    {icon:'📊',col:'#7C3AED',t:'Document both BP readings in Burak Chart',w:'NICE NG136: postural hypotension must be documented before prescribing. Undocumented = legal liability if patient falls after leaving clinic. This is your safety record.'},
    {icon:'💊',col:'#D97706',t:'Reconcile current medications before prescribing',w:'ACE inhibitor + potassium-sparing diuretic = hyperkalaemia risk. ACE inhibitor + NSAIDs = acute kidney injury. Check the full medication list before the physician prescribes.'},
    {icon:'📚',col:'#0D6B5E',t:'Patient education: ACE inhibitor cough and angioedema',w:'10-20% of patients develop ACE inhibitor cough — reassure it is the drug, not disease. Angioedema is rare but life-threatening — patient must stop medication and call 999 if face, lips, or tongue swell.'},

    {icon:'🩸',col:'#DC2626',t:'Blood cultures ×2 BEFORE antibiotics — non-negotiable',w:'Post-antibiotic blood cultures have 40-50% reduced sensitivity. Once antibiotics are given the diagnostic window closes. Cultures first, antibiotics second — this is NHSE Sepsis 6 protocol.'},
    {icon:'🛡️',col:'#D97706',t:'Check penicillin allergy BEFORE Co-Amoxiclav',w:'Co-Amoxiclav is a broad-spectrum penicillin. Cross-reactivity in penicillin allergy is up to 10%. Check wristband, ask patient, check Burak Chart allergy record — three sources, one opportunity to prevent anaphylaxis.'},

    out+='<div style="font-size:11px;color:#64748B;line-height:1.65">'+ns.w+'</div></div>';
    out+='<div style="background:'+ns.col+';color:#fff;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;flex-shrink:0;align-self:flex-start">'+(i+1)+'</div>';

  out+='<span style="font-size:18px">📋</span>';

    out+='<div style="display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;align-items:center">';

    out+='</div></div>';
    /* Read checkbox */
    out+='<div onclick="toggleOrder('+i+')" style="width:34px;height:34px;border-radius:10px;border:2px solid '+(acked?tc:'#CBD5E1')+';background:'+(acked?tc:'#fff')+';display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;color:#fff;transition:all .15s">'+(acked?'✓':'')+'</div>';
    out+='</div>';
    /* Evidence panel */
    if(o.ev){
      out+='<div style="padding:10px 14px 12px;border-top:1px solid #F8FAFC;background:#FAFBFC;display:flex;gap:10px;align-items:flex-start">';

  out+='</div>';
  /* Ack banner */
  if(!allAcked){

    out+='<div style="font-size:11px;color:#166634;margin-top:1px">Proceed to the <strong>Tasks</strong> tab to begin the care cascade</div></div></div>';
  }
  out+='</div>';

  return out;
}

    var available=prevDone;
    var priCol=t.pri==='STAT'?'#EF4444':t.pri==='Urgent'?'#D97706':'#14B8A6';

      +'style="display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:12px;margin-bottom:8px;'
      +'cursor:'+(available?'pointer':'default')+';pointer-events:'+(available?'auto':'none')+';'
      +'background:'+(done?deptCol+'08':available?'#fff':'#F8FAFC')+';'
      +'border:1.5px solid '+(done?deptCol+'44':available?'#E5E9EF':'#F1F5F9')+';'
      +'box-shadow:'+(done?'0 2px 8px '+deptCol+'15':available?'0 1px 4px rgba(0,0,0,.06)':'none')+';'
      +'opacity:'+(available?1:0.5)+';transition:all .15s">';

    out+=(done?'<span style="color:#fff;font-size:13px;font-weight:700">\u2713</span>':'');
    out+='</div>';

    /* Content */
    out+='<div style="flex:1;min-width:0">';
    out+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">';
    out+='<span style="font-size:16px">'+t.icon+'</span>';
    out+='<span style="font-size:13px;font-weight:'+(done?'500':'700')+';color:'+(done?'#94A3B8':'#0B1F3A')+';'+(done?'text-decoration:line-through;':'')+'">'+t.lbl+'</span>';
    out+='</div>';
    out+='<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
    out+='<span style="background:'+priBg+';color:'+priCol+';border:1px solid '+priCol+'33;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700">'+t.pri+'</span>';
    out+='<span style="background:#F1F5F9;color:#64748B;border-radius:5px;padding:2px 8px;font-size:10px">'+t.type+'</span>';
    if(!available&&!done)out+='<span style="color:#94A3B8;font-size:10px">\uD83D\uDD12 Complete previous task first</span>';
    out+='</div></div>';
    out+='</div>';
  });

  if(!tasks.length)out+='<div style="padding:32px;text-align:center;color:#94A3B8;font-size:13px">No tasks for this scenario.</div>';
  return out;
}

  var footer='<div style="background:#fff;border-radius:12px;border:1px solid #E5E9EF;padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)">';

  footer+='</div>';

function bPC_fluidBalance(p,v){
  if(!S.fb_iv)S.fb_iv='';if(!S.fb_oral)S.fb_oral='';if(!S.fb_meds)S.fb_meds='';
  if(!S.fb_urine)S.fb_urine='';if(!S.fb_drain)S.fb_drain='';if(!S.fb_other)S.fb_other='';
  var intake=(parseFloat(S.fb_iv)||0)+(parseFloat(S.fb_oral)||0)+(parseFloat(S.fb_meds)||0);
  var output=(parseFloat(S.fb_urine)||0)+(parseFloat(S.fb_drain)||0)+(parseFloat(S.fb_other)||0);
  var balance=intake-output;
  var balCol=balance>500?'var(--amber)':balance<-500?'var(--red)':'var(--green)';
  var out='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">';

  out+='<div style="background:#EFF6FF;border-radius:11px;padding:14px;border:1px solid #BFDBFE"><div style="font-size:11px;font-weight:800;color:#1D4ED8;margin-bottom:10px">INTAKE</div>';
  intakeItems.forEach(function(it){
    out+='<div style="margin-bottom:8px"><label style="font-size:11px;font-weight:600;color:var(--slate);display:block;margin-bottom:3px">'+it[0]+'</label>';
    out+='<input type="number" placeholder="0" value="'+(S[it[1]]||'')+'" oninput="S[\''+it[1]+'\']=this.value;var io=(parseFloat(S.fb_iv)||0)+(parseFloat(S.fb_oral)||0)+(parseFloat(S.fb_meds)||0);var oo=(parseFloat(S.fb_urine)||0)+(parseFloat(S.fb_drain)||0)+(parseFloat(S.fb_other)||0);var bl=document.getElementById(\'fb-balance\');if(bl){var b=io-oo;bl.textContent=(b>=0?\'+\':\'\')+b+\' ml\';bl.style.color=b>500?\'var(--amber)\':b<-500?\'var(--red)\':\' var(--green)\';}" style="width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:Inter,sans-serif"/></div>';
  });
  out+='</div>';
  out+='<div style="background:var(--amberl);border-radius:11px;padding:14px;border:1px solid #FDE68A"><div style="font-size:11px;font-weight:800;color:var(--amber);margin-bottom:10px">OUTPUT</div>';
  outputItems.forEach(function(it){
    out+='<div style="margin-bottom:8px"><label style="font-size:11px;font-weight:600;color:var(--slate);display:block;margin-bottom:3px">'+it[0]+'</label>';
    out+='<input type="number" placeholder="0" value="'+(S[it[1]]||'')+'" oninput="S[\''+it[1]+'\']=this.value;var io=(parseFloat(S.fb_iv)||0)+(parseFloat(S.fb_oral)||0)+(parseFloat(S.fb_meds)||0);var oo=(parseFloat(S.fb_urine)||0)+(parseFloat(S.fb_drain)||0)+(parseFloat(S.fb_other)||0);var bl=document.getElementById(\'fb-balance\');if(bl){var b=io-oo;bl.textContent=(b>=0?\'+\':\'\')+b+\' ml\';bl.style.color=b>500?\'var(--amber)\':b<-500?\'var(--red)\':\' var(--green)\';}" style="width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;font-family:Inter,sans-serif"/></div>';
  });
  out+='</div></div>';
  out+='<div style="background:#fff;border-radius:11px;border:2px solid '+balCol+';padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:12px">';
  out+='<div style="text-align:center"><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Fluid Balance</div>';

  out+='</div>';
  return out;
}

function bPC_fallsRisk(p){
  if(!S.fallsRisk)S.fallsRisk={};
  var fr=S.fallsRisk;
  var factors=[
    {id:'fr_age',q:'Patient aged 65 or over',pts:1},{id:'fr_fall',q:'History of falls in past year',pts:2},
    {id:'fr_mob',q:'Mobility impairment or use of aid',pts:2},{id:'fr_cog',q:'Cognitive impairment / confusion',pts:2},
    {id:'fr_med',q:'On high-risk medicines (sedatives, diuretics, antihypertensives)',pts:2},
    {id:'fr_vis',q:'Visual impairment',pts:1},{id:'fr_uri',q:'Urinary incontinence or frequency',pts:1}
  ];
  var total=factors.reduce(function(s,f){return s+(fr[f.id]?f.pts:0);},0);
  var risk=total>=6?'HIGH':total>=3?'MEDIUM':'LOW';
  var riskCol=risk==='HIGH'?'var(--red)':risk==='MEDIUM'?'var(--amber)':'var(--green)';
  var out='<div style="display:flex;gap:12px;margin-bottom:14px">';
  out+='<div style="background:'+riskCol+'15;border:2px solid '+riskCol+';border-radius:12px;padding:16px 20px;text-align:center;flex-shrink:0">';
  out+='<div style="font-size:28px;font-weight:900;color:'+riskCol+'">'+total+'</div>';
  out+='<div style="font-size:10px;font-weight:700;color:'+riskCol+';margin-top:2px">'+risk+' RISK</div></div>';
  out+='<div style="flex:1;background:#fff;border-radius:12px;border:1px solid var(--border);padding:14px">';
  out+='<div style="font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px">MORSE Falls Scale</div>';
  out+='<div style="font-size:12px;color:var(--slate);line-height:1.7">'+(risk==='HIGH'?'<strong style="color:var(--red)">HIGH (6+):</strong> Bed rails up, call bell in reach, non-slip footwear, hourly safety checks, document in care plan.':risk==='MEDIUM'?'<strong style="color:var(--amber)">MEDIUM (3\u20135):</strong> Supervised mobilisation, bed at lowest position, 2-hourly checks.':'<strong style="color:var(--green)">LOW (0\u20132):</strong> Standard precautions, patient education, call bell accessible.')+'</div></div></div>';
  out+='<div style="background:#fff;border-radius:11px;border:1px solid var(--border);overflow:hidden">';
  out+='<div style="padding:10px 14px;background:#FAFBFC;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--ink)">Risk Factor Assessment</div>';
  factors.forEach(function(f2){
    var chk=fr[f2.id]||false;
    out+='<div onclick="if(!S.fallsRisk)S.fallsRisk={};S.fallsRisk[\''+f2.id+'\']=!S.fallsRisk[\''+f2.id+'\'];render()" style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;background:'+(chk?'var(--amberl)':'#fff')+'">';
    out+='<div style="width:20px;height:20px;border-radius:5px;border:2px solid '+(chk?'var(--amber)':'var(--border)')+';background:'+(chk?'var(--amber)':'#fff')+';display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0">'+(chk?'\u2713':'')+'</div>';
    out+='<div style="flex:1;font-size:13px;color:'+(chk?'#92400E':'var(--ink)')+'">'+f2.q+'</div>';
    out+='<span style="font-size:11px;font-weight:700;color:'+(chk?'var(--amber)':'var(--muted)')+'">+'+f2.pts+'</span></div>';
  });
  out+='</div>';
  return out;
}

  var n2act=n2<=2?'Maintain 4-6 hourly observations.':n2<=4?'Increase to 2-hourly. Inform nurse in charge.':n2<=6?'Call doctor within 1 hour. Continuous monitoring.':'Call CRASH TEAM / MET immediately. Begin ABCDE. IV access. High-flow O2.';

  out+='<div><div style="font-size:14px;font-weight:800;color:'+n2col+'">NEWS2 Score: '+n2t(n2)+'</div><div style="font-size:12px;color:var(--slate);margin-top:3px">'+n2t_txt+'</div></div></div>';
  out+='<div style="background:#fff;border-radius:9px;padding:11px 13px;font-size:12px;color:var(--ink);line-height:1.7"><strong>Required action:</strong> '+n2act+'</div></div>';
  out+='<div style="background:#fff;border-radius:11px;border:1px solid var(--border);overflow:hidden;margin-bottom:12px">';
  out+='<div style="padding:10px 14px;background:#FAFBFC;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--ink)">Escalation Documentation Checklist</div>';
  [['esc1','Doctor / MET team contacted \u2014 name documented',!!S.escDoc1],
   ['esc2','Exact time of escalation call documented',!!S.escDoc2],
   ['esc3','NEWS2 score communicated verbally',!!S.escDoc3],

function calcN2(v) {
  var s=0, rr=+v.rr||0, sp=+v.spo2||0, sb=+v.sbp||0, hr=+v.hr||0, tm=+v.temp||0;
  if(rr<=8||rr>=25) s+=3; else if(rr>=21) s+=2; else if(rr<=11) s+=1;
  if(sp<=91) s+=3; else if(sp<=93) s+=2; else if(sp<=95) s+=1;
  if(sb<=90||sb>=220) s+=3; else if(sb<=100) s+=2; else if(sb<=110) s+=1;
  if(hr<=40||hr>=131) s+=3; else if(hr>=111) s+=2; else if((hr>=91&&hr<=110)||(hr>=41&&hr<=50)) s+=1;
  if(tm<=35) s+=3; else if(tm>=39.1) s+=2; else if(tm<=36||tm>=38.1) s+=1;
  if(v.avpu && v.avpu!=='A') s+=3;
  if(v.o2 && v.o2!=='RA') s+=2;
  return s;
}
function n2c(n) { return n===0?'#1A7F54':n<=4?'#1A56DB':n<=6?'#B7791F':'#C53030'; }
function n2t(n) { return n===0?'Stable — routine monitoring':n<=4?'Low — increase monitoring':n<=6?'Medium — call doctor urgently':'HIGH — emergency response NOW'; }

function bVitals(){

function beginEnc(deptId, ptId) {
  var ptList = deptId==='ip'?PT_IP : deptId==='ed'?PT_ED : PT_OPD;
  var pt = ptList.filter(function(p){return p.id===ptId;})[0];
  if(!pt) return;
  S.dept = deptId;
  S.activeSc = JSON.parse(JSON.stringify(SCD[deptId]));
  // Override patient data with selected patient
  S.activeSc.pt.first = pt.first;
  S.activeSc.pt.last = pt.last;
  S.activeSc.pt.mrn = pt.mrn;
  S.activeSc.pt.age = pt.age;
  S.activeSc.pt.sex = pt.sex;
  S.activeSc.pt.att = pt.att;
  S.activeSc.pt.allergy = pt.allergy;
  S.activeSc.pt.dx = pt.dx;
  S.activeSc.pt.loc = pt.loc||pt.loc;
  S.activeSc.pt.cc = pt.cc||pt.dx;
  if(pt.spec) S.activeSc.pt.spec = pt.spec;
  S.vitals = JSON.parse(JSON.stringify(S.activeSc.vitals));
  S.view='app'; S.step=0;
  S.pcCascade={ordersRead:false,labsAck:false,pharmAck:false,imagingAck:false,deptAck:false};
  S.pcTab='docorders'; S.ordersDone={}; S.pcTasks={}; S.marDone={};
  S.soap={S:'',O:'',A:'',P:''}; S.hov={S:'',B:'',A:'',R:''};
  S.triage={}; S.checkin={first:pt.first||'',last:pt.last||'',dob:pt.dob||''};
  S.trigFired={}; S.triggers={abxBeforeCx:false,allergyOk:false};
  startPSI(); render();
}
window.beginEnc = beginEnc;

function advCL(idx,next){
  if(next===2)teach('wristband_scan');
  else if(next===4)teach('med_scan');
  else if(next===-1)teach('mar_sign');
  if(next===-1){
    var sc2=sc();
    if(sc2&&sc2.mar&&sc2.mar[idx]){
      if(!S.marDone)S.marDone={};if(!S.marTime)S.marTime={};
      S.marDone['m'+idx]=true;
      S.marTime['m'+idx]=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      boostPSI(5);
      logA('MAR: '+sc2.mar[idx].n+' administered at '+S.marTime['m'+idx]);
      showJingle({title:sc2.mar[idx].n.split(' ').slice(0,2).join(' ')+' ✓',
        icon:'✅',color:'#0D6B5E',
        msg:'Administered at '+S.marTime['m'+idx]+'. Barcode verified. MAR signed.',
        why:'Closed-loop verification eliminates wrong-drug and wrong-patient errors.'});
      S.clMed=null;S.clStep=0;
    }
  }else{S.clStep=next;}
  render();
}

function startTransfer(id){
  var tr=SCD_TRANSFERS&&SCD_TRANSFERS[id];
  if(!tr){showToast('Transfer scenario not found','#DC2626');return;}
  var baseScd=SCD[tr.to]||SCD[tr.from]||SCD.ip;
  S.activeSc={id:tr.id,name:tr.label,
    pt:JSON.parse(JSON.stringify(tr.pt)),
    vitals:JSON.parse(JSON.stringify(tr.vitals)),
    orders:baseScd.orders||[],mar:baseScd.mar||[],
    transferMode:true,transferFrom:tr.from,transferTo:tr.to,
    transferTeaching:tr.teaching,transferDesc:tr.desc||''};
  S.dept=tr.to;
  S.vitals=JSON.parse(JSON.stringify(tr.vitals));
  S.checkin={first:tr.pt.first,last:tr.pt.last,dob:tr.pt.dob||''};
  S.view='app';S.step=0;
  S.pcCascade={ordersRead:false,labsAck:false,pharmAck:false,imagingAck:false,deptAck:false};
  S.pcTab='docorders';S.ordersDone={};S.pcTasks={};S.marDone={};S.marTime={};
  S.soap={S:'',O:'',A:'',P:''};S.hov={S:'',B:'',A:'',R:''};
  S.triage={};S.trigFired={};S.triggers={abxBeforeCx:false,allergyOk:false};
  S.disruption=null;S.blockMsg=null;S.clMed=null;S.clStep=0;
  logA('Transfer started: '+tr.label,'','ok');
  startPSI();render();
}
window.startTransfer=startTransfer;

function aiSbarDraft(){
  var p=pt(),sc2=sc(),v=S.vitals.rr?S.vitals:(sc2&&sc2.vitals)||{};
  var n2=calcN2(v);
  var isED=S.dept==='ed',isOPD=S.dept==='opd';
  var tasks=TASKS(S.dept,n2).filter(function(t){return(S.pcTasks||{})[t.id];});
  var meds=(sc2&&sc2.mar||[]).filter(function(m,i){return(S.marDone||{})['m'+i];});
  var nl='\n';
  if(!S.hov.S){
    var sit='I am '+(S.name||'RN')+', caring for '+(p.first||'')+' '+(p.last||'')+', MRN '+(p.mrn||'--')+', '+( p.loc||'this unit')+'.'+nl;
    sit+=isED?'Presented: '+p.cc+(S.disposition?'. Disposition: '+S.disposition+'.':'. Disposition pending.'):isOPD?'Attending for: '+p.cc+'. Consultation complete.':'Admitted with '+p.dx+'. Currently stable on ward.';
    S.hov.S=sit;
    var el=document.getElementById('hov-S');if(el)el.value=S.hov.S;
  }
  if(!S.hov.B){
    var bg='Dx: '+(p.dx||'--')+'. NEWS2 '+n2+' ('+n2t(n2)+').'+nl;
    bg+='Vitals: RR '+(v.rr||'?')+'/min, SpO\u2082 '+(v.spo2||'?')+'%, BP '+(v.sbp||'?')+'/'+(v.dbp||'?')+' mmHg, HR '+(v.hr||'?')+'bpm, Temp '+(v.temp||'?')+'\u00b0C. AVPU: '+(v.avpu||'A')+'.';
    if(tasks.length)bg+=nl+'Tasks completed: '+tasks.map(function(t){return t.lbl.split(':')[0];}).join(', ')+'.';
    if(meds.length)bg+=nl+'Medications given: '+meds.map(function(m){return m.n.split(' ').slice(0,3).join(' ');}).join(', ')+'.';
    if(p.allergy&&p.allergy!=='NKDA')bg+=nl+'ALLERGY ON FILE: '+p.allergy+'.';
    S.hov.B=bg;
    var el=document.getElementById('hov-B');if(el)el.value=S.hov.B;
  }
  if(!S.hov.A){
    var as='Patient with '+(p.dx||'diagnosis')+'. NEWS2 '+n2+': '+n2t(n2)+'.'+nl;
    as+=n2>=5?'HIGH RISK: Immediate medical review required. Do not wait.':n2>=3?'Medium risk: Increased monitoring. Inform oncoming nurse of escalation plan.':'Stable: Continue current monitoring and care plan.';
    if(S.soap&&S.soap.A&&S.soap.A.length>10)as+=nl+'My assessment: '+S.soap.A.substring(0,120)+(S.soap.A.length>120?'...':'');
    S.hov.A=as;
    var el=document.getElementById('hov-A');if(el)el.value=S.hov.A;
  }
  if(!S.hov.R){
    var rec='Continue NEWS2 '+(n2>=5?'every 30 min':n2>=3?'every 2 hours':'every 4 hours')+'.'+nl;
    rec+='Escalate to '+(p.att||'attending physician')+' if NEWS2 rises to '+(Math.max(n2+2,5))+'+ or any clinical deterioration.';
    if(isED&&S.disposition)rec+=nl+'Patient disposition: '+(S.disposition==='admit'?'Ward admission \u2014 bed confirmed.':S.disposition==='discharge'?'Discharge home \u2014 education provided.':'Specialist transfer \u2014 team notified.')+'.';
    rec+=nl+'Contact me directly before administering any new medications.';
    S.hov.R=rec;
    var el=document.getElementById('hov-R');if(el)el.value=S.hov.R;
  }
  updN();
  showToast('\uD83E\uDD16 SBAR draft generated \u2014 review and personalise before reading aloud','#1A56DB');
}
window.aiSbarDraft=aiSbarDraft;

function teach(key){

  if(!t)return;
  var ex=document.getElementById('nurse-teach');if(ex)ex.remove();
  var el=document.createElement('div');
  el.id='nurse-teach';
  el.style.cssText='position:fixed;bottom:100px;right:22px;z-index:500;width:330px;background:#fff;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.18);overflow:hidden;animation:slideUpIn .25s ease-out;font-family:Inter,-apple-system,sans-serif';
  el.innerHTML=
    '<div style="background:'+t.col+';padding:11px 14px;display:flex;align-items:center;gap:10px">'
    +'<div style="font-size:22px;flex-shrink:0">'+t.icon+'</div>'
    +'<div style="flex:1"><div style="font-size:12px;font-weight:800;color:#fff;line-height:1.3">'+t.title+'</div>'
    +'<div style="font-size:10px;color:rgba(255,255,255,.6);margin-top:2px">🎓 Nurse Co-pilot Teaching</div></div>'
    +'<button onclick="this.closest(\'#nurse-teach\').remove()" style="width:22px;height:22px;border:none;background:rgba(255,255,255,.2);border-radius:6px;color:#fff;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">\u00d7</button>'
    +'</div>'
    +'<div style="padding:12px 14px">'
    +'<div style="font-size:12px;color:#1E293B;line-height:1.7;margin-bottom:8px">'+t.body+'</div>'
    +'<div style="background:#F8FAFC;border-left:3px solid '+t.col+';border-radius:0 7px 7px 0;padding:8px 10px;font-size:11px;color:#475569;line-height:1.55">'
    +'<strong style="color:'+t.col+'">📖 Why this matters: </strong>'+t.why+'</div>'
    +'</div>';
  document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.remove();},7000);
}

/* ═══ NEW bEDBoard_full — Greaseboard with pipeline status ════════════ */
function bEDBoard_full(){
  var now = new Date();

  var h = '<div>';
  /* Dark greaseboard header */
  h += '<div style="background:linear-gradient(135deg,#0F172A,#1E293B);border-radius:14px;padding:18px 22px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.3)">';

  /* Summary */
  var red=PT_ED.filter(function(p){return p.triage==='Red';}).length;
  var orange=PT_ED.filter(function(p){return p.triage==='Orange';}).length;
  var yellow=PT_ED.filter(function(p){return p.triage==='Yellow';}).length;
  var xferred=PT_ED.filter(function(p){var r=HOSP.get(p.mrn);return r&&r.status==='transferred_to_ip';}).length;
  h += '<div style="display:flex;gap:10px">';
  [{lbl:'Red',val:red,col:'#EF4444',bg:'rgba(239,68,68,.2)'},{lbl:'Orange',val:orange,col:'#F97316',bg:'rgba(249,115,22,.2)'},{lbl:'Yellow',val:yellow,col:'#EAB308',bg:'rgba(234,179,8,.2)'},{lbl:'Transferred',val:xferred,col:'#14B8A6',bg:'rgba(20,184,166,.2)'}].forEach(function(s){
    h += '<div style="background:'+s.bg+';border:1px solid '+s.col+'44;border-radius:9px;padding:8px 14px;text-align:center">';
    h += '<div style="font-size:18px;font-weight:900;color:'+s.col+'">'+s.val+'</div>';
    h += '<div style="font-size:9px;font-weight:700;color:'+s.col+';text-transform:uppercase;letter-spacing:.8px;margin-top:2px">'+s.lbl+'</div></div>';
  });
  h += '</div></div>';

  /* Column headers */
  h += '<div style="display:grid;grid-template-columns:80px 1fr 80px 80px 200px 80px 120px 140px;gap:0;padding:0 12px;margin-bottom:6px">';
  ['Bay','Patient','Triage','Age','Diagnosis','LOS','Pathway','Action'].forEach(function(c){
    h += '<div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;padding:4px 0">'+c+'</div>';
  });
  h += '</div>';

  /* Rows */
  var sorted = PT_ED.slice().sort(function(a,b){
    var order={Red:0,Orange:1,Yellow:2,Green:3,Blue:4};
    return (order[a.triage]||4)-(order[b.triage]||4);
  });
  sorted.forEach(function(p){
    var triCol=p.triage==='Red'?'#EF4444':p.triage==='Orange'?'#F97316':p.triage==='Yellow'?'#EAB308':'#14B8A6';
    var rec = HOSP.get(p.mrn);
    var isTransferred = rec && rec.status === 'transferred_to_ip';
    var pathway = rec ? HOSP.getPathwayLabel(p.mrn) : '\uD83D\uDE91 ED';
    var los = rec ? Math.floor((new Date().getTime()-rec.admTime)/60000) : Math.floor(Math.random()*180+30);
    var losStr = los >= 60 ? Math.floor(los/60)+'h '+(los%60)+'m' : los+'m';
    var losCrit = los > 240; /* >4h is a target breach */

    h += '<div style="display:grid;grid-template-columns:80px 1fr 80px 80px 200px 80px 120px 140px;gap:0;background:'+(isTransferred?'rgba(20,184,166,.08)':'rgba(255,255,255,.04)')+';border:1px solid '+(isTransferred?'rgba(20,184,166,.3)':'rgba(255,255,255,.06)')+';border-radius:10px;padding:10px 12px;margin-bottom:5px;align-items:center;opacity:'+(isTransferred?'0.7':'1')+'">';
    /* Bay */
    h += '<div style="font-size:12px;font-weight:700;color:'+triCol+'">'+p.loc+'</div>';
    /* Patient */
    h += '<div><div style="font-size:13px;font-weight:700;color:#fff">'+p.first+' '+p.last+'</div>';
    h += '<div style="font-size:10px;color:rgba(255,255,255,.4);margin-top:1px;font-family:monospace">'+p.mrn+'</div></div>';
    /* Triage */
    h += '<div><span style="background:'+triCol+'22;color:'+triCol+';border:1px solid '+triCol+'44;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700">'+p.triage+'</span></div>';
    /* Age */
    h += '<div style="font-size:12px;color:rgba(255,255,255,.6)">'+p.age+'y '+p.sex+'</div>';
    /* Diagnosis */
    h += '<div style="font-size:11px;color:rgba(255,255,255,.7);line-height:1.4">'+p.dx+'</div>';
    /* LOS */
    h += '<div style="font-size:12px;font-weight:700;color:'+(losCrit?'#EF4444':'rgba(255,255,255,.5)')+'">'+losStr+(losCrit?' \u26a0':'')+' </div>';
    /* Pathway */
    h += '<div style="font-size:10px;color:'+(isTransferred?'#14B8A6':'rgba(255,255,255,.35)')+';line-height:1.6">'+pathway+'</div>';
    /* Action */
    if(isTransferred) {
      h += '<div><span style="background:rgba(20,184,166,.2);color:#14B8A6;border:1px solid rgba(20,184,166,.3);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700">\u2713 Transferred</span></div>';
    } else {
      h += '<div><button onclick="beginEnc(\'ed\',\''+p.id+'\')" style="padding:7px 14px;background:#EF4444;border:none;border-radius:7px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;font-family:Inter,sans-serif;white-space:nowrap">Attend \u2192</button></div>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

/* ═══════════════════════════════════════════════════════════════════════
   BURAK HEALTH — HOSPITAL PATIENT FLOW ENGINE
   
   Architecture:
   - HOSP object tracks each patient's journey status
   - Patients can move: ED → IP → OPD
   - When an ED encounter completes → patient auto-appears in IP board
   - When an IP encounter completes → patient auto-appears in OPD board
   - Patient cards show their full pathway breadcrumb
   - 20 ED patients rotating through the system gives the "live hospital" feel
   ═══════════════════════════════════════════════════════════════════════ */

var HOSP = {
  /* patient registry: keyed by mrn */
  patients: {},
  
  /* stats */
  totalMoved: 0,
  
  /* register a patient with initial status */
  init: function() {
    /* Pre-populate ED patients — they are the entry point */
    PT_ED.forEach(function(p) {
      if(!HOSP.patients[p.mrn]) {
        HOSP.patients[p.mrn] = {
          mrn: p.mrn,
          first: p.first, last: p.last,
          age: p.age, sex: p.sex,
          allergy: p.allergy,
          currentDept: 'ed',
          status: 'ed_active',   /* ed_active | transferred_to_ip | ip_active | discharged_to_opd | opd_active | complete */
          pathway: ['ed'],       /* ordered list of depts visited */
          encounters: {},        /* dept → summary */
          admTime: new Date().getTime() - Math.floor(Math.random()*7200000)
        };
      }
    });
    /* IP patients start on the ward */
    PT_IP.forEach(function(p) {
      if(!HOSP.patients[p.mrn]) {
        HOSP.patients[p.mrn] = {
          mrn: p.mrn,
          first: p.first, last: p.last,
          age: p.age, sex: p.sex,
          allergy: p.allergy,
          currentDept: 'ip',
          status: 'ip_active',
          pathway: ['ip'],
          encounters: {},
          admTime: new Date().getTime() - Math.floor(Math.random()*86400000*3)
        };
      }
    });
    /* OPD patients are in clinic */
    PT_OPD.forEach(function(p) {
      if(!HOSP.patients[p.mrn]) {
        HOSP.patients[p.mrn] = {
          mrn: p.mrn,
          first: p.first, last: p.last,
          age: p.age, sex: p.sex,
          allergy: p.allergy,
          currentDept: 'opd',
          status: 'opd_active',
          pathway: ['opd'],
          encounters: {},
          admTime: new Date().getTime() - Math.floor(Math.random()*3600000*4)
        };
      }
    });
  },
  
  /* Called when an encounter completes */
  completeEncounter: function(mrn, dept, summary) {
    var rec = HOSP.patients[mrn];
    if(!rec) return;
    rec.encounters[dept] = summary;
    
    /* Determine next step based on department and disposition */
    if(dept === 'ed') {
      var disp = summary.disposition || 'admit';
      if(disp === 'admit' || disp === 'transfer') {
        /* Move to IP */
        rec.status = 'transferred_to_ip';
        rec.currentDept = 'ip';
        if(rec.pathway.indexOf('ip') < 0) rec.pathway.push('ip');
        /* Create IP board entry */
        HOSP._addToIP(mrn, rec, summary);
        HOSP.totalMoved++;
        showToast('\uD83C\uDFE5 ' + rec.first + ' ' + rec.last + ' transferred to Inpatient Ward', '#0D6B5E');
      } else {
        rec.status = 'discharged_home';
        rec.pathway.push('home');
        showToast('\uD83C\uDFE0 ' + rec.first + ' ' + rec.last + ' discharged home from ED', '#1A56DB');
      }
    } else if(dept === 'ip') {
      /* Move to OPD follow-up */
      rec.status = 'discharged_to_opd';
      rec.currentDept = 'opd';
      if(rec.pathway.indexOf('opd') < 0) rec.pathway.push('opd');
      HOSP._addToOPD(mrn, rec, summary);
      HOSP.totalMoved++;
      showToast('\uD83E\uDE7A ' + rec.first + ' ' + rec.last + ' — OPD follow-up appointment booked', '#3B82F6');
    } else if(dept === 'opd') {
      rec.status = 'complete';
      rec.pathway.push('complete');
      showToast('\u2705 ' + rec.first + ' ' + rec.last + ' — care episode complete', '#1A7F54');
    }
  },
  
  /* Add a transferred ED patient to the IP board dynamically */
  _addToIP: function(mrn, rec, edSummary) {
    /* Check if already in PT_IP */
    var exists = PT_IP.filter(function(p){return p.mrn===mrn;}).length > 0;
    if(exists) {
      /* Update their status */
      PT_IP.forEach(function(p){ if(p.mrn===mrn) { p.fromED=true; p.edSummary=edSummary; p.transferTime=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }});
    } else {
      /* Create new IP entry from ED patient data */
      var n = {
        id: 'ED_TO_IP_' + mrn,
        first: rec.first, last: rec.last,
        age: rec.age, sex: rec.sex,
        mrn: mrn, loc: 'Ward 6 — Bed Assigned',
        dx: edSummary.dx || 'Transfer from ED',
        att: edSummary.att || 'Dr. On Call',
        allergy: rec.allergy || 'NKDA',
        news2: edSummary.news2 || 2,
        adm: new Date().getDate(),
        fromED: true,
        edSummary: edSummary,
        transferTime: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        flag: 'ED Transfer'
      };
      PT_IP.push(n);
    }
  },
  
  /* Add a discharged IP patient to OPD follow-up */
  _addToOPD: function(mrn, rec, ipSummary) {
    var exists = PT_OPD.filter(function(p){return p.mrn===mrn;}).length > 0;
    if(!exists) {
      var n = {
        id: 'IP_TO_OPD_' + mrn,
        first: rec.first, last: rec.last,
        age: rec.age, sex: rec.sex,
        mrn: mrn, loc: 'Clinic Room TBC',
        dx: 'Follow-up: ' + (ipSummary.dx || 'Post-discharge review'),
        att: ipSummary.att || 'Dr. Clinic',
        allergy: rec.allergy || 'NKDA',
        spec: 'General Medicine',
        fromIP: true,
        ipSummary: ipSummary,
        apptTime: '09:00',
        flag: 'Post-Discharge Follow-up'
      };
      PT_OPD.push(n);
    }
  },
  
  /* Get patient record by MRN */
  get: function(mrn) { return HOSP.patients[mrn] || null; },
  
  /* Get pathway label */
  getPathwayLabel: function(mrn) {
    var rec = HOSP.patients[mrn];
    if(!rec || !rec.pathway) return '';
    var deptNames = {ed:'\uD83D\uDE91 ED', ip:'\uD83C\uDFE5 IP Ward', opd:'\uD83E\uDE7A OPD', home:'\uD83C\uDFE0 Home', complete:'\u2705 Complete'};
    return rec.pathway.map(function(d){return deptNames[d]||d;}).join(' \u2192 ');
  },

  /* Pipeline stats for header */
  stats: function() {
    var all = Object.values(HOSP.patients);
    return {
      inED: all.filter(function(p){return p.currentDept==='ed'&&p.status!=='transferred_to_ip';}).length,
      inIP: all.filter(function(p){return p.currentDept==='ip'&&p.status!=='discharged_to_opd';}).length,
      inOPD: all.filter(function(p){return p.currentDept==='opd';}).length,
      moved: HOSP.totalMoved,
      complete: all.filter(function(p){return p.status==='complete';}).length
    };
  }
};

/* Initialise on load */
try { HOSP.init(); } catch(e) {}
window.HOSP = HOSP;

  /* Build contextual summary lines for each stage */

    icon = '🚦'; title = 'Triage Complete';
    var cat = S.triage.category || '—';
    var catCol = cat==='Red'?'#EF4444':cat==='Orange'?'#F97316':cat==='Yellow'?'#EAB308':'#14B8A6';
    lines.push('Triage category: <strong style="color:'+catCol+'">'+cat+'</strong>');
    lines.push('Pain score: <strong>' + (S.triage.pain||'0') + ' / 10</strong>');
    lines.push('Chief complaint: ' + (S.triage.cc || p.cc || p.dx || '—'));
  } else if (stepId === 'vitals') {
    icon = '📊'; title = 'Vital Signs Recorded';
    lines.push('RR: <strong>'+v.rr+'/min</strong> &nbsp;|&nbsp; SpO₂: <strong>'+v.spo2+'%</strong> &nbsp;|&nbsp; BP: <strong>'+v.sbp+'/'+v.dbp+' mmHg</strong>');

  } else if (stepId === 'powerchart') {
    icon = '💻'; title = 'Burak Chart Complete';

    var doneTasks = tasks.filter(function(t){return (S.pcTasks||{})[t.id];});
    lines.push('Doctor orders: <strong>Acknowledged</strong>');
    lines.push('Nursing tasks completed: <strong>' + doneTasks.length + ' of ' + tasks.length + '</strong>');
    lines.push('Labs, Pharmacy & Imaging reviewed and signed off.');
  } else if (stepId === 'orders') {
    icon = '📋'; title = 'Orders Acknowledged';
    var sc2 = sc();
    var ords = (sc2&&sc2.orders)||[];
    var done = ords.filter(function(_,i){return (S.ordersDone||{})['o'+i];});
    lines.push('<strong>' + done.length + '</strong> orders acknowledged and actioned.');
    lines.push('All orders are now on the nursing record.');
  } else if (stepId === 'soap') {
    icon = '📝'; title = 'SOAP Note Signed';
    lines.push('<strong>S:</strong> ' + (S.soap.S||'').substring(0,80) + (S.soap.S&&S.soap.S.length>80?'…':''));
    lines.push('<strong>A:</strong> ' + (S.soap.A||'').substring(0,80) + (S.soap.A&&S.soap.A.length>80?'…':''));
    lines.push('Note is now locked in Burak EMR.');
  } else if (stepId === 'pyxis') {
    icon = '💊'; title = 'Medications Administered';
    var sc3 = sc();
    var mar = (sc3&&sc3.mar)||[];
    var given = mar.filter(function(_,i){return (S.marDone||{})['m'+i];});
    lines.push('<strong>' + given.length + '</strong> medication' + (given.length!==1?'s':'') + ' administered and signed on MAR.');
    if (given.length) lines.push('Last: <strong>' + given[given.length-1].n.split(' ').slice(0,4).join(' ') + '</strong>');
    lines.push('Five rights completed. Pyxis drawer closed and locked.');

    lines.push('Situation, Background, Assessment & Recommendation documented.');
    if (S.disposition) lines.push('Disposition: <strong>' + (S.disposition==='admit'?'Admitted to Ward':S.disposition==='discharge'?'Discharged Home':'Transfer to Specialist') + '</strong>');
    lines.push('Encounter complete. Patient care handed over.');

  var overlay = document.createElement('div');
  overlay.id = 'stage-summary-modal';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;background:rgba(11,31,58,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .18s ease-out;font-family:Inter,-apple-system,sans-serif';

  var nextHtml = nextLbl !== 'Done'

  overlay.innerHTML =

    + nextHtml + '</div>'
    + '<div style="background:rgba(255,255,255,.15);border-radius:10px;padding:6px 12px;text-align:center">'
    + '<div style="font-size:18px;font-weight:900;color:#fff">'+(stepDone+1)+'</div>'
    + '<div style="font-size:9px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.8px">of 8</div>'
    + '</div></div>'
    /* Summary lines */
    + '<div style="padding:22px 26px">'
    + '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px">'
    + lines.map(function(l){
        return '<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:#F8FAFC;border-radius:9px;font-size:13px;color:#1E293B;line-height:1.5">'
          + '<span style="color:'+deptCol+';flex-shrink:0;margin-top:1px">▸</span><div>'+l+'</div></div>';
      }).join('')
    + '</div>'

    + '</div></div>';

  window._stageSummaryCb = cb;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) stageSummaryDone(); });
  /* Auto-advance after 6s if nurse doesn't click */
  window._stageSummaryTimer = setTimeout(stageSummaryDone, 6000);
}

var ReferralManager = (function () {
  var VALID_PATHS = {
    'ed':  ['ip', 'opd'],
    'ip':  ['opd'],
    'opd': ['ip_sda'],
    'phcc':['opd']

  ];
  return {
    validateReferral: function (src, tgt) {
      for (var i = 0; i < HARD_LOCKS.length; i++) {
        if (HARD_LOCKS[i].from === src && HARD_LOCKS[i].to === tgt) {
          return { ok: false, error: '[Governance] ' + HARD_LOCKS[i].reason };
        }
      }
      var allowed = VALID_PATHS[src] || [];
      var ok = allowed.indexOf(tgt) >= 0;
      if (!ok) {
        return { ok: false, error: '[Governance] ' + src.toUpperCase() + ' → ' + tgt.toUpperCase() +
          ' is not a permitted referral path. Valid targets: ' + (allowed.join(', ').toUpperCase() || 'none') + '.' };
      }
      return { ok: true, error: null };

    validTargetsFor: function (src) { return (VALID_PATHS[src] || []).slice(); }

/* ─────────────────────────────────────────────────────────────────────
   2. SDA COUNTDOWN BADGE ON BOARD ROWS
      Wraps bIPBoard() so any patient with isSDA:true gets a small live
      countdown pill next to their normal row content. Since bIPBoard()
      returns a full HTML string, we inject the badge via a lightweight
      string marker rather than touching your original table-building
      logic — your row layout is untouched.
   ───────────────────────────────────────────────────────────────────── */
(function patchIPBoardForCountdownBadge(){
  var _origIPBoard = window.bIPBoard;
  if (typeof _origIPBoard !== 'function') {
    console.warn('[BurakCascade v3.1] bIPBoard not found — countdown badges skipped.');
    return;
  }
  window.bIPBoard = function () {
    var raw = _origIPBoard();
    var sdaPatients = (window.PT_IP || []).filter(function (p) { return p.isSDA && p.sdaStartTs; });
    if (!sdaPatients.length) return raw;

    sdaPatients.forEach(function (p) {
      var badgeId = 'sda-badge-' + p.mrn.replace(/[^a-z0-9]/gi, '');
      var badge = '<span id="' + badgeId + '" data-sda-start="' + p.sdaStartTs + '" '
        + 'style="display:inline-flex;align-items:center;gap:4px;background:rgba(107,33,168,.12);'
        + 'border:1px solid rgba(107,33,168,.3);border-radius:6px;padding:2px 8px;font-size:10px;'
        + 'font-weight:700;color:#6B21A8;margin-left:6px;font-family:monospace;white-space:nowrap">'
        + '⏱ --:--:--</span>';

      /* Insert the badge right after the patient's name in their row.
         We match on the MRN, which is unique and always rendered. */
      var mrnMarker = p.mrn;
      var idx = raw.indexOf(mrnMarker);
      if (idx >= 0) {
        /* Find the end of the nearest closing </div> after the MRN text
           so the badge sits on the same line without breaking layout. */
        var divEnd = raw.indexOf('</div>', idx);
        if (divEnd >= 0) {
          raw = raw.slice(0, divEnd) + badge + raw.slice(divEnd);
        }
      }
    });

    _startSDABadgeTicker();
    return raw;
  };
})();

function _startSDABadgeTicker() {
  if (window._sdaBadgeInterval) clearInterval(window._sdaBadgeInterval);
  window._sdaBadgeInterval = setInterval(function () {
    var badges = document.querySelectorAll('[id^="sda-badge-"]');
    if (!badges.length) { clearInterval(window._sdaBadgeInterval); window._sdaBadgeInterval = null; return; }
    badges.forEach(function (el) {
      var startTs = parseInt(el.getAttribute('data-sda-start'), 10);
      if (!startTs) return;
      var elapsed = Math.floor((Date.now() - startTs) / 1000);
      var remain = Math.max(86400 - elapsed, 0);
      var hh = Math.floor(remain / 3600), mm = Math.floor((remain % 3600) / 60), ss = remain % 60;
      var str = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
      el.textContent = '⏱ ' + str;
      if (remain === 0) { el.style.color = '#DC2626'; el.style.borderColor = '#FECACA'; el.textContent = '⏱ Window closed'; }
    });
  }, 1000);
}
