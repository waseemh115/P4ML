/* ─────────────────────────────────────────────────────────────────────
   1. SDA QUEUE — separate patient array, populated by _bridgeToSDA()
      instead of being pushed into PT_IP. We patch _bridgeToSDA to stop
      writing into PT_IP and write into PT_SDA instead.
   ───────────────────────────────────────────────────────────────────── */
var PT_SDA = [];
window.PT_SDA = PT_SDA;

(function patchBridgeToSDAForSeparateQueue(){
  if (typeof window._bridgeToSDA !== 'function') {
    console.warn('[BurakCascade v3.2] _bridgeToSDA not found — install v3 patch first.');
    return;
  }
  /* Fully replace _bridgeToSDA: same governance + HOSP bookkeeping as
     v3, but the patient record lands in PT_SDA, not PT_IP. */
  window._bridgeToSDA = function (mrn, summary) {
    var rec = HOSP.get(mrn);
    if (!rec) { showToast('Patient not found in HOSP registry: ' + mrn, '#DC2626'); return false; }

    rec.status = 'SDA_ADMISSION';
    rec.currentDept = 'ip_sda';
    if (rec.pathway.indexOf('ip_sda') < 0) rec.pathway.push('ip_sda');
    rec.sdaStartTs = Date.now();
    rec.encounters.opd = summary || rec.encounters.opd || {};

    var opdPatient = PT_OPD.filter(function (p) { return p.mrn === mrn; })[0];
    if (opdPatient) {
      var existsInSDA = PT_SDA.filter(function (p) { return p.mrn === mrn; }).length > 0;
      if (!existsInSDA) {
        PT_SDA.push({
          id: 'SDA_' + mrn,
          first: opdPatient.first, last: opdPatient.last,
          age: opdPatient.age, sex: opdPatient.sex,
          mrn: mrn, loc: 'SDA Recovery Bay ' + (PT_SDA.length + 1),
          dx: opdPatient.dx || 'Elective procedure',
          att: opdPatient.att, allergy: opdPatient.allergy || 'NKDA',
          spec: opdPatient.spec, isSDA: true, sdaStartTs: rec.sdaStartTs,
          flag: '⚕️'
        });
      }
    }
    HOSP.totalMoved++;
    showToast('⚕️ ' + rec.first + ' ' + rec.last + ' moved to SDA Recovery Queue — 24-hour window opened', '#6B21A8');
    if (typeof render === 'function') render();
    return true;
  };
})();


/* ─────────────────────────────────────────────────────────────────────
   2. SDA BOARD RENDERER — reuses your existing board visual language
      (cards, badges, colours) but is a standalone list, not bIPBoard().
   ───────────────────────────────────────────────────────────────────── */
function bSDABoard() {
  var h = '<div>';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">';
  h += '<div><div style="font-size:18px;font-weight:900;color:#0B1F3A;letter-spacing:-.3px">⚕️ SDA Recovery Queue</div>';
  h += '<div style="font-size:12px;color:#64748B;margin-top:2px">Same-Day Admission · Elective recovery pathway · '
     +  PT_SDA.length + ' patient' + (PT_SDA.length !== 1 ? 's' : '') + ' currently in recovery</div></div>';
  h += '</div>';

  if (!PT_SDA.length) {
    h += '<div style="background:#fff;border-radius:12px;border:1px solid #E5E9EF;padding:32px;text-align:center;color:#8A96A8;font-size:13px">'
       + '<div style="font-size:34px;margin-bottom:10px">⚕️</div>'
       + '<div style="font-weight:700;margin-bottom:4px;color:#475569">No patients in SDA recovery</div>'
       + '<div>Use "Proceed to SDA" on an OPD patient\'s handover screen to bridge them here.</div></div>';
    return h + '</div>';
  }

  PT_SDA.forEach(function (p) {
    var timer = _sdaTimerParts(p.sdaStartTs);
    var doneCount = (window.SDA_RECOVERY_TASKS || []).filter(function (t) { return S.pcTasks && S.pcTasks['sda_' + p.mrn + '_' + t.id]; }).length;
    var totalTasks = (window.SDA_RECOVERY_TASKS || []).length;
    var allDone = totalTasks > 0 && doneCount === totalTasks;

    h += '<div style="background:#fff;border-radius:13px;border:1.5px solid #DDD6FE;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 8px rgba(107,33,168,.08)">';
    h += '<div style="background:linear-gradient(135deg,#3B0764,#6B21A8);padding:16px 20px;display:flex;align-items:center;gap:14px">';
    h += '<div style="width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">⚕️</div>';
    h += '<div style="flex:1"><div style="font-size:15px;font-weight:800;color:#fff">' + p.first + ' ' + p.last + '</div>';
    h += '<div style="font-size:11px;color:rgba(255,255,255,.55);margin-top:2px">' + p.mrn + ' · ' + p.dx + (p.spec ? ' · ' + p.spec : '') + '</div></div>';
    h += '<div style="text-align:center;flex-shrink:0"><div id="sda-queue-timer-' + p.mrn.replace(/[^a-z0-9]/gi, '') + '" data-sda-start="' + p.sdaStartTs
       + '" style="font-size:20px;font-weight:900;color:#fff;font-family:monospace">' + timer.str + '</div>';
    h += '<div style="font-size:9px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.8px">Remaining</div></div>';
    h += '</div>';

    h += '<div style="padding:16px 20px">';
    h += '<div style="height:6px;background:#F1F5F9;border-radius:3px;overflow:hidden;margin-bottom:14px">';
    h += '<div style="height:100%;width:' + timer.pct + '%;background:#6B21A8;border-radius:3px"></div></div>';

    h += '<div style="font-size:12px;font-weight:700;color:#6B21A8;margin-bottom:9px">Discharge Criteria (' + doneCount + '/' + totalTasks + ')</div>';
    (window.SDA_RECOVERY_TASKS || []).forEach(function (t) {
      var key = 'sda_' + p.mrn + '_' + t.id;
      var done = !!(S.pcTasks && S.pcTasks[key]);
      h += '<div onclick="if(!S.pcTasks)S.pcTasks={};S.pcTasks[\'' + key + '\']=!S.pcTasks[\'' + key + '\'];render()" '
         + 'style="display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-radius:9px;'
         + 'border:1.5px solid ' + (done ? '#C4B5FD' : '#E5E9EF') + ';background:' + (done ? '#F5F3FF' : '#fff') + ';cursor:pointer;margin-bottom:6px">';
      h += '<div style="width:20px;height:20px;border-radius:5px;border:2px solid ' + (done ? '#6B21A8' : '#CBD5E1') + ';background:' + (done ? '#6B21A8' : '#fff')
         + ';display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;margin-top:1px">' + (done ? '✓' : '') + '</div>';
      h += '<span style="font-size:15px;flex-shrink:0">' + t.icon + '</span>';
      h += '<div style="font-size:12px;font-weight:600;color:' + (done ? '#3B0764' : '#0B1F3A') + ';line-height:1.5">' + t.lbl + '</div></div>';
    });

    h += '<button onclick="' + (allDone ? 'completeSDAFromQueue(\'' + p.mrn + '\')' : '') + '" '
       + 'style="margin-top:6px;width:100%;padding:13px;border:none;border-radius:10px;'
       + 'background:' + (allDone ? '#1A7F54' : '#CBD5E1') + ';color:#fff;font-size:13px;font-weight:700;'
       + 'cursor:' + (allDone ? 'pointer' : 'not-allowed') + ';font-family:Inter,sans-serif">'
       + (allDone ? '✅ Complete SDA & Discharge to OPD Follow-up' : '🔒 Complete all criteria above to discharge')
       + '</button>';
    h += '</div></div>';
  });

  /* live ticking for all timers on this board */
  _startSDAQueueTicker();

  h += '</div>';
  return h;
}
window.bSDABoard = bSDABoard;

function _sdaTimerParts(startTs) {
  var elapsed = Math.floor((Date.now() - (startTs || Date.now())) / 1000);
  var total = 86400, remain = Math.max(total - elapsed, 0);
  var hh = Math.floor(remain / 3600), mm = Math.floor((remain % 3600) / 60), ss = remain % 60;
  return {
    str: (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss,
    pct: Math.round(elapsed / total * 100)
  };
}

function _startSDAQueueTicker() {
  if (window._sdaQueueInterval) clearInterval(window._sdaQueueInterval);
  window._sdaQueueInterval = setInterval(function () {
    var els = document.querySelectorAll('[id^="sda-queue-timer-"]');
    if (!els.length) { clearInterval(window._sdaQueueInterval); window._sdaQueueInterval = null; return; }
    els.forEach(function (el) {
      var startTs = parseInt(el.getAttribute('data-sda-start'), 10);
      if (!startTs) return;
      var t = _sdaTimerParts(startTs);
      el.textContent = t.str;
    });
  }, 1000);
}

/* Completes SDA discharge from the queue board — moves patient to OPD
   follow-up, removes them from PT_SDA, mirrors completeSDADischarge(). */
function completeSDAFromQueue(mrn) {
  var rec = HOSP.get(mrn);
  if (rec) {
    rec.status = 'complete';
    rec.currentDept = 'opd';
    if (rec.pathway.indexOf('opd') < 0) rec.pathway.push('opd');
  }
  for (var i = PT_SDA.length - 1; i >= 0; i--) {
    if (PT_SDA[i].mrn === mrn) PT_SDA.splice(i, 1);
  }
  var existsInOPD = PT_OPD.filter(function (p) { return p.mrn === mrn; }).length > 0;
  if (!existsInOPD && rec) {
    PT_OPD.push({
      id: 'SDA_TO_OPD_' + mrn,
      first: rec.first, last: rec.last, age: rec.age, sex: rec.sex,
      mrn: mrn, loc: 'Clinic Room TBC',
      dx: 'Post-SDA follow-up review',
      att: 'Dr. Clinic', allergy: rec.allergy || 'NKDA',
      fromIP: false, apptTime: '09:00', flag: 'Post-SDA Follow-up'
    });
  }
  HOSP.totalMoved++;
  showToast('✅ SDA complete — patient discharged to OPD follow-up', '#1A7F54');
  if (typeof showLiveTransferBanner === 'function') showLiveTransferBanner(rec ? (rec.first + ' ' + rec.last) : mrn, 'ip_sda', 'opd');
  S.ptBoardTab = 'sda';
  render();
}
window.completeSDAFromQueue = completeSDAFromQueue;

function _injectDashboardStrip(raw) {

  var barEnd = raw.indexOf('</div></div>', idx);
  if (barEnd < 0) return raw;

/* Plain-language source labels, keyed by department + referralSource
   pattern. This is deliberately a teaching glossary, not a data model —
   it reads whatever fields your patient objects already carry
   (fromED, fromOPD, fromIP, triage, arv, etc.) and falls back sensibly
   when a field isn't present, so it works on your existing 20-patient
   seed data without requiring new fields everywhere. */
function getProvenanceLabel(p, dept) {
  if (dept === 'ip' || dept === 'ip_sda') {
    if (p.fromED) return { icon: '🚨', text: 'from ED', col: '#EF4444' };
    if (p.fromOPD) return { icon: '🩺', text: 'from OPD (SDA bridge)', col: '#6B21A8' };
    return { icon: '📋', text: 'Elective / planned admission', col: '#0D6B5E' };
  }
  if (dept === 'ed') {
    /* No upstream department for ED — it's an entry point. We classify
       by arrival mode if present, otherwise default to walk-in. */
    if (p.arrivalMode === 'ambulance' || p.triage === 'Red') {
      return { icon: '🚑', text: 'Ambulance arrival', col: '#DC2626' };
    }
    return { icon: '🚶', text: 'Walk-in / Self-presented', col: '#475569' };
  }
  if (dept === 'opd') {
    if (p.fromIP) return { icon: '🏥', text: 'from IP discharge', col: '#14B8A6' };
    if (p.fromED) return { icon: '🚨', text: 'from ED', col: '#EF4444' };
    if (p.isSDA === false && p.spec) return { icon: '🏡', text: 'GP / Primary Care referral', col: '#8A96A8' };
    return { icon: '🏡', text: 'GP / Primary Care referral', col: '#8A96A8' };
  }
  return { icon: '📋', text: 'Direct entry', col: '#8A96A8' };
}

/* ─────────────────────────────────────────────────────────────────────
   2. PER-PATIENT PATHWAY STATE — extends each PT_SDA record with a
      .pathway object tracking which stage they're on and what's ticked.
   ───────────────────────────────────────────────────────────────────── */
function _ensurePathwayState(p) {
  if (!p.pathway) {
    p.pathway = {
      stageIndex: 0,           /* index into SDA_STAGES */
      preopDone: {}, signinDone: {}, timeoutDone: {}, signoutDone: {}, recoveryDone: {},
      procedureStartTs: null,  /* set when entering Procedure stage — anchors recovery timing */
      procedureNote: ''
    };
  }
  return p.pathway;
}

function _specialtyPreopTasks(p) {
  var extra = (p.spec && window.SPECIALTY_CHECKLISTS && window.SPECIALTY_CHECKLISTS[p.spec]) || [];
  return extra.map(function (t) { return { id: t.id, icon: t.icon, lbl: t.lbl, mandatory: t.mandatory !== false }; });
}

function _stageComplete(p, stageId) {
  var pw = _ensurePathwayState(p);
  if (stageId === 'preop') {
    var tasks = SDA_PREOP_TASKS.concat(_specialtyPreopTasks(p));
    return tasks.filter(function (t) { return t.mandatory; }).every(function (t) { return pw.preopDone[t.id]; });
  }
  if (stageId === 'signin') return WHO_SIGN_IN.every(function (t) { return pw.signinDone[t.id]; });
  if (stageId === 'procedure') return WHO_TIME_OUT.every(function (t) { return pw.timeoutDone[t.id]; }) && pw.procedureNote && pw.procedureNote.length > 5;
  if (stageId === 'signout') return WHO_SIGN_OUT.every(function (t) { return pw.signoutDone[t.id]; });
  if (stageId === 'recovery') {
    var must = SDA_RECOVERY_STAGED_TASKS.filter(function (t) { return t.window === 'discharge-gate' || t.window === 'ongoing'; });
    return must.every(function (t) { return pw.recoveryDone[t.id]; });
  }
  return false;
}

function sdaAdvanceStage(mrn) {
  var p = PT_SDA.filter(function (x) { return x.mrn === mrn; })[0];
  if (!p) return;
  var pw = _ensurePathwayState(p);
  var current = SDA_STAGES[pw.stageIndex];
  if (!_stageComplete(p, current)) {
    showToast('Complete every mandatory item in this stage before advancing.', '#DC2626');
    return;
  }
  if (current === 'preop') {
    addLog && addLog('SDA', p.first + ' ' + p.last + ' — Pre-Op complete, entering WHO Sign In', 'ok');
  }
  if (current === 'signin') {
    pw.procedureStartTs = Date.now();
    showToast('🔪 Procedure stage started — recovery timing now anchored to this moment', '#DC2626');
  }
  if (current === 'recovery') {
    /* Final stage — completing it discharges the patient entirely */
    completeSDAFromQueue(mrn);
    return;
  }
  pw.stageIndex = Math.min(pw.stageIndex + 1, SDA_STAGES.length - 1);
  showToast('✓ Advanced to ' + SDA_STAGE_LABELS[SDA_STAGES[pw.stageIndex]].lbl, SDA_STAGE_LABELS[SDA_STAGES[pw.stageIndex]].col);
  render();
}
window.sdaAdvanceStage = sdaAdvanceStage;

function sdaToggleTask(mrn, bucket, taskId) {
  var p = PT_SDA.filter(function (x) { return x.mrn === mrn; })[0];
  if (!p) return;
  var pw = _ensurePathwayState(p);
  pw[bucket][taskId] = !pw[bucket][taskId];
  render();
}
window.sdaToggleTask = sdaToggleTask;

function sdaUpdateProcedureNote(mrn, val) {
  var p = PT_SDA.filter(function (x) { return x.mrn === mrn; })[0];
  if (!p) return;
  _ensurePathwayState(p).procedureNote = val;
}
window.sdaUpdateProcedureNote = sdaUpdateProcedureNote;

  }

  }

  return h;

    window._sdaBoardCore = window.bSDABoard;
  }

    var raw = window._sdaBoardCore();
    /* Re-apply v3.3-style provenance badges on top of the gated
       pathway markup, matched by MRN exactly as v3.3 did. */
    if (typeof window.renderProvenanceBadge === 'function' && window.PT_SDA) {

})();

function bPC_fluidBalance(p,v){

  });

  });

function bPC_fallsRisk(p){
  if(!S.fallsRisk)S.fallsRisk={};
  var fr=S.fallsRisk;
  var factors=[
    {id:'fr_age',q:'Patient aged 65 or over',pts:1},{id:'fr_fall',q:'History of falls in past year',pts:2},
    {id:'fr_mob',q:'Mobility impairment or use of aid',pts:2},{id:'fr_cog',q:'Cognitive impairment / confusion',pts:2},
    {id:'fr_med',q:'On high-risk medicines (sedatives, diuretics, antihypertensives)',pts:2},
    {id:'fr_vis',q:'Visual impairment',pts:1},{id:'fr_uri',q:'Urinary incontinence or frequency',pts:1}
  ];
  var total=factors.reduce(function(s,f){return s+(fr[f.id]?f.pts:0);},0);
  var risk=total>=6?'HIGH':total>=3?'MEDIUM':'LOW';
  var riskCol=risk==='HIGH'?'var(--red)':risk==='MEDIUM'?'var(--amber)':'var(--green)';
  var out='<div style="display:flex;gap:12px;margin-bottom:14px">';
  out+='<div style="background:'+riskCol+'15;border:2px solid '+riskCol+';border-radius:12px;padding:16px 20px;text-align:center;flex-shrink:0">';
  out+='<div style="font-size:28px;font-weight:900;color:'+riskCol+'">'+total+'</div>';
  out+='<div style="font-size:10px;font-weight:700;color:'+riskCol+';margin-top:2px">'+risk+' RISK</div></div>';
  out+='<div style="flex:1;background:#fff;border-radius:12px;border:1px solid var(--border);padding:14px">';
  out+='<div style="font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px">MORSE Falls Scale</div>';
  out+='<div style="font-size:12px;color:var(--slate);line-height:1.7">'+(risk==='HIGH'?'<strong style="color:var(--red)">HIGH (6+):</strong> Bed rails up, call bell in reach, non-slip footwear, hourly safety checks, document in care plan.':risk==='MEDIUM'?'<strong style="color:var(--amber)">MEDIUM (3\u20135):</strong> Supervised mobilisation, bed at lowest position, 2-hourly checks.':'<strong style="color:var(--green)">LOW (0\u20132):</strong> Standard precautions, patient education, call bell accessible.')+'</div></div></div>';
  out+='<div style="background:#fff;border-radius:11px;border:1px solid var(--border);overflow:hidden">';
  out+='<div style="padding:10px 14px;background:#FAFBFC;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--ink)">Risk Factor Assessment</div>';
  factors.forEach(function(f2){
    var chk=fr[f2.id]||false;
    out+='<div onclick="if(!S.fallsRisk)S.fallsRisk={};S.fallsRisk[\''+f2.id+'\']=!S.fallsRisk[\''+f2.id+'\'];render()" style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;background:'+(chk?'var(--amberl)':'#fff')+'">';
    out+='<div style="width:20px;height:20px;border-radius:5px;border:2px solid '+(chk?'var(--amber)':'var(--border)')+';background:'+(chk?'var(--amber)':'#fff')+';display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0">'+(chk?'\u2713':'')+'</div>';
    out+='<div style="flex:1;font-size:13px;color:'+(chk?'#92400E':'var(--ink)')+'">'+f2.q+'</div>';
    out+='<span style="font-size:11px;font-weight:700;color:'+(chk?'var(--amber)':'var(--muted)')+'">+'+f2.pts+'</span></div>';
  });
  out+='</div>';
  return out;
}

    out+='<div style="flex:1;font-size:12px;color:var(--ink)">'+row[1]+'</div></div>';
  });

function calcN2(v) {
  var s=0, rr=+v.rr||0, sp=+v.spo2||0, sb=+v.sbp||0, hr=+v.hr||0, tm=+v.temp||0;
  if(rr<=8||rr>=25) s+=3; else if(rr>=21) s+=2; else if(rr<=11) s+=1;
  if(sp<=91) s+=3; else if(sp<=93) s+=2; else if(sp<=95) s+=1;
  if(sb<=90||sb>=220) s+=3; else if(sb<=100) s+=2; else if(sb<=110) s+=1;
  if(hr<=40||hr>=131) s+=3; else if(hr>=111) s+=2; else if((hr>=91&&hr<=110)||(hr>=41&&hr<=50)) s+=1;
  if(tm<=35) s+=3; else if(tm>=39.1) s+=2; else if(tm<=36||tm>=38.1) s+=1;
  if(v.avpu && v.avpu!=='A') s+=3;
  if(v.o2 && v.o2!=='RA') s+=2;
  return s;
}

/* ═══════════════════════════════════════════════════════════════
   PATIENT BOARD FUNCTIONS
   bPatients() — main router
   bIPBoard()  — Ward whiteboard
   bEDBoard()  — ED tracking board (greaseboard style)
   bOPDBoard() — Clinic list
   beginEnc()  — start encounter from any board
═══════════════════════════════════════════════════════════════ */

function beginEnc(deptId, ptId) {
  var ptList = deptId==='ip'?PT_IP : deptId==='ed'?PT_ED : PT_OPD;
  var pt = ptList.filter(function(p){return p.id===ptId;})[0];
  if(!pt) return;
  S.dept = deptId;
  S.activeSc = JSON.parse(JSON.stringify(SCD[deptId]));
  // Override patient data with selected patient
  S.activeSc.pt.first = pt.first;
  S.activeSc.pt.last = pt.last;
  S.activeSc.pt.mrn = pt.mrn;
  S.activeSc.pt.age = pt.age;
  S.activeSc.pt.sex = pt.sex;
  S.activeSc.pt.att = pt.att;
  S.activeSc.pt.allergy = pt.allergy;
  S.activeSc.pt.dx = pt.dx;
  S.activeSc.pt.loc = pt.loc||pt.loc;
  S.activeSc.pt.cc = pt.cc||pt.dx;
  if(pt.spec) S.activeSc.pt.spec = pt.spec;
  S.vitals = JSON.parse(JSON.stringify(S.activeSc.vitals));
  S.view='app'; S.step=0;
  S.pcCascade={ordersRead:false,labsAck:false,pharmAck:false,imagingAck:false,deptAck:false};
  S.pcTab='docorders'; S.ordersDone={}; S.pcTasks={}; S.marDone={};
  S.soap={S:'',O:'',A:'',P:''}; S.hov={S:'',B:'',A:'',R:''};
  S.triage={}; S.checkin={first:pt.first||'',last:pt.last||'',dob:pt.dob||''};
  S.trigFired={}; S.triggers={abxBeforeCx:false,allergyOk:false};
  startPSI(); render();
}
window.beginEnc = beginEnc;

    (p&&p.first?'Reviewing orders for '+p.first+' '+p.last+'. ':'')+
    (isED?'Acknowledge STAT orders within 5 minutes. Never administer an unread order.':
     isOPD?'Confirm every order before the patient leaves clinic. You are the final safety check.':

    h+='<div style="background:#FFFBEB;border:1.5px solid #FCD34D;border-radius:11px;padding:13px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start">'

      +'</div></div>';
  });
  h+='</div>';
  return h;
}



function trigDisrupt(){

  render();
}

function advCL(idx,next){
  if(next===2)teach('wristband_scan');
  else if(next===4)teach('med_scan');
  else if(next===-1)teach('mar_sign');
  if(next===-1){
    var sc2=sc();
    if(sc2&&sc2.mar&&sc2.mar[idx]){
      if(!S.marDone)S.marDone={};if(!S.marTime)S.marTime={};
      S.marDone['m'+idx]=true;
      S.marTime['m'+idx]=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      boostPSI(5);
      logA('MAR: '+sc2.mar[idx].n+' administered at '+S.marTime['m'+idx]);
      showJingle({title:sc2.mar[idx].n.split(' ').slice(0,2).join(' ')+' ✓',
        icon:'✅',color:'#0D6B5E',
        msg:'Administered at '+S.marTime['m'+idx]+'. Barcode verified. MAR signed.',
        why:'Closed-loop verification eliminates wrong-drug and wrong-patient errors.'});
      S.clMed=null;S.clStep=0;
    }
  }else{S.clStep=next;}
  render();
}
function cancelCL(){S.clMed=null;S.clStep=0;render();}

function teach(key){
  var t=TEACH[key];
  if(!t)return;
  var ex=document.getElementById('nurse-teach');if(ex)ex.remove();
  var el=document.createElement('div');
  el.id='nurse-teach';
  el.style.cssText='position:fixed;bottom:100px;right:22px;z-index:500;width:330px;background:#fff;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.18);overflow:hidden;animation:slideUpIn .25s ease-out;font-family:Inter,-apple-system,sans-serif';
  el.innerHTML=
    '<div style="background:'+t.col+';padding:11px 14px;display:flex;align-items:center;gap:10px">'
    +'<div style="font-size:22px;flex-shrink:0">'+t.icon+'</div>'
    +'<div style="flex:1"><div style="font-size:12px;font-weight:800;color:#fff;line-height:1.3">'+t.title+'</div>'
    +'<div style="font-size:10px;color:rgba(255,255,255,.6);margin-top:2px">🎓 Nurse Co-pilot Teaching</div></div>'
    +'<button onclick="this.closest(\'#nurse-teach\').remove()" style="width:22px;height:22px;border:none;background:rgba(255,255,255,.2);border-radius:6px;color:#fff;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">\u00d7</button>'
    +'</div>'
    +'<div style="padding:12px 14px">'
    +'<div style="font-size:12px;color:#1E293B;line-height:1.7;margin-bottom:8px">'+t.body+'</div>'
    +'<div style="background:#F8FAFC;border-left:3px solid '+t.col+';border-radius:0 7px 7px 0;padding:8px 10px;font-size:11px;color:#475569;line-height:1.55">'
    +'<strong style="color:'+t.col+'">📖 Why this matters: </strong>'+t.why+'</div>'
    +'</div>';
  document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.remove();},7000);
}
window.teach=teach;



function tch(k){try{teach(k);}catch(e){}}
window.tch=tch;

    var losCrit = los > 240; /* >4h is a target breach */

    h += '<div style="display:grid;grid-template-columns:80px 1fr 80px 80px 200px 80px 120px 140px;gap:0;background:'+(isTransferred?'rgba(20,184,166,.08)':'rgba(255,255,255,.04)')+';border:1px solid '+(isTransferred?'rgba(20,184,166,.3)':'rgba(255,255,255,.06)')+';border-radius:10px;padding:10px 12px;margin-bottom:5px;align-items:center;opacity:'+(isTransferred?'0.7':'1')+'">';

/* ═══════════════════════════════════════════════════════════════════════
   BURAK HEALTH — HOSPITAL PATIENT FLOW ENGINE
   
   Architecture:
   - HOSP object tracks each patient's journey status
   - Patients can move: ED → IP → OPD
   - When an ED encounter completes → patient auto-appears in IP board
   - When an IP encounter completes → patient auto-appears in OPD board
   - Patient cards show their full pathway breadcrumb
   - 20 ED patients rotating through the system gives the "live hospital" feel
   ═══════════════════════════════════════════════════════════════════════ */

var HOSP = {
  /* patient registry: keyed by mrn */
  patients: {},
  
  /* stats */
  totalMoved: 0,
  
  /* register a patient with initial status */
  init: function() {
    /* Pre-populate ED patients — they are the entry point */
    PT_ED.forEach(function(p) {
      if(!HOSP.patients[p.mrn]) {
        HOSP.patients[p.mrn] = {
          mrn: p.mrn,
          first: p.first, last: p.last,
          age: p.age, sex: p.sex,
          allergy: p.allergy,
          currentDept: 'ed',
          status: 'ed_active',   /* ed_active | transferred_to_ip | ip_active | discharged_to_opd | opd_active | complete */
          pathway: ['ed'],       /* ordered list of depts visited */
          encounters: {},        /* dept → summary */
          admTime: new Date().getTime() - Math.floor(Math.random()*7200000)
        };
      }
    });
    /* IP patients start on the ward */
    PT_IP.forEach(function(p) {
      if(!HOSP.patients[p.mrn]) {
        HOSP.patients[p.mrn] = {
          mrn: p.mrn,
          first: p.first, last: p.last,
          age: p.age, sex: p.sex,
          allergy: p.allergy,
          currentDept: 'ip',
          status: 'ip_active',
          pathway: ['ip'],
          encounters: {},
          admTime: new Date().getTime() - Math.floor(Math.random()*86400000*3)
        };
      }
    });
    /* OPD patients are in clinic */
    PT_OPD.forEach(function(p) {
      if(!HOSP.patients[p.mrn]) {
        HOSP.patients[p.mrn] = {
          mrn: p.mrn,
          first: p.first, last: p.last,
          age: p.age, sex: p.sex,
          allergy: p.allergy,
          currentDept: 'opd',
          status: 'opd_active',
          pathway: ['opd'],
          encounters: {},
          admTime: new Date().getTime() - Math.floor(Math.random()*3600000*4)
        };
      }
    });
  },
  
  /* Called when an encounter completes */
  completeEncounter: function(mrn, dept, summary) {
    var rec = HOSP.patients[mrn];
    if(!rec) return;
    rec.encounters[dept] = summary;
    
    /* Determine next step based on department and disposition */
    if(dept === 'ed') {
      var disp = summary.disposition || 'admit';
      if(disp === 'admit' || disp === 'transfer') {
        /* Move to IP */
        rec.status = 'transferred_to_ip';
        rec.currentDept = 'ip';
        if(rec.pathway.indexOf('ip') < 0) rec.pathway.push('ip');
        /* Create IP board entry */
        HOSP._addToIP(mrn, rec, summary);
        HOSP.totalMoved++;
        showToast('\uD83C\uDFE5 ' + rec.first + ' ' + rec.last + ' transferred to Inpatient Ward', '#0D6B5E');
      } else {
        rec.status = 'discharged_home';
        rec.pathway.push('home');
        showToast('\uD83C\uDFE0 ' + rec.first + ' ' + rec.last + ' discharged home from ED', '#1A56DB');
      }
    } else if(dept === 'ip') {
      /* Move to OPD follow-up */
      rec.status = 'discharged_to_opd';
      rec.currentDept = 'opd';
      if(rec.pathway.indexOf('opd') < 0) rec.pathway.push('opd');
      HOSP._addToOPD(mrn, rec, summary);
      HOSP.totalMoved++;
      showToast('\uD83E\uDE7A ' + rec.first + ' ' + rec.last + ' — OPD follow-up appointment booked', '#3B82F6');
    } else if(dept === 'opd') {
      rec.status = 'complete';
      rec.pathway.push('complete');
      showToast('\u2705 ' + rec.first + ' ' + rec.last + ' — care episode complete', '#1A7F54');
    }
  },
  
  /* Add a transferred ED patient to the IP board dynamically */
  _addToIP: function(mrn, rec, edSummary) {
    /* Check if already in PT_IP */
    var exists = PT_IP.filter(function(p){return p.mrn===mrn;}).length > 0;
    if(exists) {
      /* Update their status */
      PT_IP.forEach(function(p){ if(p.mrn===mrn) { p.fromED=true; p.edSummary=edSummary; p.transferTime=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }});
    } else {
      /* Create new IP entry from ED patient data */
      var n = {
        id: 'ED_TO_IP_' + mrn,
        first: rec.first, last: rec.last,
        age: rec.age, sex: rec.sex,
        mrn: mrn, loc: 'Ward 6 — Bed Assigned',
        dx: edSummary.dx || 'Transfer from ED',
        att: edSummary.att || 'Dr. On Call',
        allergy: rec.allergy || 'NKDA',
        news2: edSummary.news2 || 2,
        adm: new Date().getDate(),
        fromED: true,
        edSummary: edSummary,
        transferTime: new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        flag: 'ED Transfer'
      };
      PT_IP.push(n);
    }
  },
  
  /* Add a discharged IP patient to OPD follow-up */
  _addToOPD: function(mrn, rec, ipSummary) {
    var exists = PT_OPD.filter(function(p){return p.mrn===mrn;}).length > 0;
    if(!exists) {
      var n = {
        id: 'IP_TO_OPD_' + mrn,
        first: rec.first, last: rec.last,
        age: rec.age, sex: rec.sex,
        mrn: mrn, loc: 'Clinic Room TBC',
        dx: 'Follow-up: ' + (ipSummary.dx || 'Post-discharge review'),
        att: ipSummary.att || 'Dr. Clinic',
        allergy: rec.allergy || 'NKDA',
        spec: 'General Medicine',
        fromIP: true,
        ipSummary: ipSummary,
        apptTime: '09:00',
        flag: 'Post-Discharge Follow-up'
      };
      PT_OPD.push(n);
    }
  },
  
  /* Get patient record by MRN */
  get: function(mrn) { return HOSP.patients[mrn] || null; },
  
  /* Get pathway label */
  getPathwayLabel: function(mrn) {
    var rec = HOSP.patients[mrn];
    if(!rec || !rec.pathway) return '';
    var deptNames = {ed:'\uD83D\uDE91 ED', ip:'\uD83C\uDFE5 IP Ward', opd:'\uD83E\uDE7A OPD', home:'\uD83C\uDFE0 Home', complete:'\u2705 Complete'};
    return rec.pathway.map(function(d){return deptNames[d]||d;}).join(' \u2192 ');
  },

  /* Pipeline stats for header */
  stats: function() {
    var all = Object.values(HOSP.patients);
    return {
      inED: all.filter(function(p){return p.currentDept==='ed'&&p.status!=='transferred_to_ip';}).length,
      inIP: all.filter(function(p){return p.currentDept==='ip'&&p.status!=='discharged_to_opd';}).length,
      inOPD: all.filter(function(p){return p.currentDept==='opd';}).length,
      moved: HOSP.totalMoved,
      complete: all.filter(function(p){return p.status==='complete';}).length
    };
  }
};

/* Initialise on load */
try { HOSP.init(); } catch(e) {}
window.HOSP = HOSP;

      h+='<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F8FAFC">';
      h+='<div style="width:8px;height:8px;border-radius:50%;background:'+ev.col+';flex-shrink:0"></div>';
      h+='<div style="flex:1;font-size:12px;color:#1E293B">'+ev.label+'</div>';
      h+='<div style="font-size:11px;font-weight:700;color:'+ev.col+'">'+ev.time+'</div></div>';
    });
    h+='</div>';

    var recvDone=IFT_CHECKLISTS.receiving.every(function(i){return ift.checklistB[i.id];});
    if(recvDone){
      h+='<div style="background:#F0FDF9;border:2px solid #14B8A6;border-radius:12px;padding:16px 18px;text-align:center">';
      h+='<div style="font-size:28px;margin-bottom:8px">\u2705</div>';
      h+='<div style="font-size:14px;font-weight:800;color:#0D6B5E;margin-bottom:4px">Transfer Complete</div>';
      h+='<div style="font-size:12px;color:#065F46">Patient successfully received at Al-Wakra Hospital. Full transfer record saved in Burak Health.</div>';
      h+='<button onclick="IFT_STATE={active:false,phase:0,patient:null,timeline:[],checklistA:{},checklistB:{},vitalsEn:{},eta:null};S.view=\'patients\';S.ptBoardTab=\'ip\';render()" '
        +'style="margin-top:14px;padding:11px 24px;background:#14B8A6;border:none;border-radius:9px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:Inter,sans-serif">'
        +'\u2190 Back to Ward Board</button>';
      h+='</div>';
    } else {
      h+='<div style="font-size:11px;color:#64748B;text-align:center;margin-bottom:12px">'+IFT_CHECKLISTS.receiving.filter(function(i){return ift.checklistB[i.id];}).length+' / '+IFT_CHECKLISTS.receiving.length+' items complete</div>';
    }
    h+='</div></div>';
  }

  h+='</div></div>';
  return h;
}

function bIFT_render(){render();}
window.bIFT_render=bIFT_render;
window.IFT_STATE=IFT_STATE;

function startIFT(ptData){
  IFT_STATE.active=true;
  IFT_STATE.phase=0;
  IFT_STATE.patient=ptData||null;
  IFT_STATE.timeline=[];
  IFT_STATE.checklistA={};
  IFT_STATE.checklistB={};
  S.view='ift';
  render();
}


/* ═══════════════════════════════════════════════════════════════
   1. STAGE SUMMARY INTERSTITIAL
   Called from nextStep() — shows a centred summary of what the 
   nurse just completed before moving forward.
   ═══════════════════════════════════════════════════════════════ */
function showStageSummary(stepDone, nextLbl, cb) {
  var ex = document.getElementById('stage-summary-modal');
  if (ex) ex.remove();

  var p = pt(), v = S.vitals, n2 = calcN2(v);
  var deptCol = S.dept==='ed'?'#EF4444':S.dept==='opd'?'#3B82F6':'#14B8A6';
  var stepId = STEPS[stepDone];

  /* Build contextual summary lines for each stage */
  var lines = [];
  var icon = '✅';
  var title = '';

  if (stepId === 'checkin') {
    icon = '🪪'; title = 'Patient Registered';
    lines.push('Patient: <strong>' + S.checkin.first + ' ' + S.checkin.last + '</strong>');
    lines.push('Date of birth: <strong>' + S.checkin.dob + '</strong>');
    lines.push('Two patient identifiers confirmed — identity verified.');
  } else if (stepId === 'triage') {
    icon = '🚦'; title = 'Triage Complete';
    var cat = S.triage.category || '—';
    var catCol = cat==='Red'?'#EF4444':cat==='Orange'?'#F97316':cat==='Yellow'?'#EAB308':'#14B8A6';
    lines.push('Triage category: <strong style="color:'+catCol+'">'+cat+'</strong>');
    lines.push('Pain score: <strong>' + (S.triage.pain||'0') + ' / 10</strong>');
    lines.push('Chief complaint: ' + (S.triage.cc || p.cc || p.dx || '—'));
  } else if (stepId === 'vitals') {
    icon = '📊'; title = 'Vital Signs Recorded';
    lines.push('RR: <strong>'+v.rr+'/min</strong> &nbsp;|&nbsp; SpO₂: <strong>'+v.spo2+'%</strong> &nbsp;|&nbsp; BP: <strong>'+v.sbp+'/'+v.dbp+' mmHg</strong>');
    lines.push('HR: <strong>'+v.hr+' bpm</strong> &nbsp;|&nbsp; Temp: <strong>'+v.temp+'°C</strong> &nbsp;|&nbsp; AVPU: <strong>'+(v.avpu||'A')+'</strong>');
    var n2col = n2>=5?'#EF4444':n2>=3?'#D97706':'#1A7F54';
    lines.push('NEWS2 Score: <strong style="color:'+n2col+'">'+n2+' — '+n2t(n2)+'</strong> → ' + n2a(n2));
  } else if (stepId === 'powerchart') {
    icon = '💻'; title = 'Burak Chart Complete';
    var tasks = TASKS(S.dept, n2);
    var doneTasks = tasks.filter(function(t){return (S.pcTasks||{})[t.id];});
    lines.push('Doctor orders: <strong>Acknowledged</strong>');
    lines.push('Nursing tasks completed: <strong>' + doneTasks.length + ' of ' + tasks.length + '</strong>');
    lines.push('Labs, Pharmacy & Imaging reviewed and signed off.');
  } else if (stepId === 'orders') {
    icon = '📋'; title = 'Orders Acknowledged';
    var sc2 = sc();
    var ords = (sc2&&sc2.orders)||[];
    var done = ords.filter(function(_,i){return (S.ordersDone||{})['o'+i];});
    lines.push('<strong>' + done.length + '</strong> orders acknowledged and actioned.');
    lines.push('All orders are now on the nursing record.');
  } else if (stepId === 'soap') {
    icon = '📝'; title = 'SOAP Note Signed';
    lines.push('<strong>S:</strong> ' + (S.soap.S||'').substring(0,80) + (S.soap.S&&S.soap.S.length>80?'…':''));
    lines.push('<strong>A:</strong> ' + (S.soap.A||'').substring(0,80) + (S.soap.A&&S.soap.A.length>80?'…':''));
    lines.push('Note is now locked in Burak EMR.');
  } else if (stepId === 'pyxis') {
    icon = '💊'; title = 'Medications Administered';
    var sc3 = sc();
    var mar = (sc3&&sc3.mar)||[];
    var given = mar.filter(function(_,i){return (S.marDone||{})['m'+i];});
    lines.push('<strong>' + given.length + '</strong> medication' + (given.length!==1?'s':'') + ' administered and signed on MAR.');
    if (given.length) lines.push('Last: <strong>' + given[given.length-1].n.split(' ').slice(0,4).join(' ') + '</strong>');
    lines.push('Five rights completed. Pyxis drawer closed and locked.');
  } else if (stepId === 'handover') {
    icon = '📞'; title = 'SBAR Handover Complete';
    lines.push('Situation, Background, Assessment & Recommendation documented.');
    if (S.disposition) lines.push('Disposition: <strong>' + (S.disposition==='admit'?'Admitted to Ward':S.disposition==='discharge'?'Discharged Home':'Transfer to Specialist') + '</strong>');
    lines.push('Encounter complete. Patient care handed over.');
  }

  var overlay = document.createElement('div');
  overlay.id = 'stage-summary-modal';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:3000;display:flex;align-items:center;justify-content:center;background:rgba(11,31,58,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .18s ease-out;font-family:Inter,-apple-system,sans-serif';

  var nextHtml = nextLbl !== 'Done'
    ? '<div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:6px;text-transform:uppercase;letter-spacing:1px">Next → ' + nextLbl + '</div>'
    : '<div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:6px">Completing encounter…</div>';

  overlay.innerHTML =
    '<div style="width:min(500px,92vw);background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.45);animation:slideUpIn .22s ease-out">'
    /* Header */
    + '<div style="background:'+deptCol+';padding:22px 26px;display:flex;align-items:center;gap:16px">'
    + '<div style="font-size:40px;flex-shrink:0">'+icon+'</div>'
    + '<div style="flex:1"><div style="font-size:18px;font-weight:900;color:#fff">'+title+'</div>'
    + nextHtml + '</div>'
    + '<div style="background:rgba(255,255,255,.15);border-radius:10px;padding:6px 12px;text-align:center">'
    + '<div style="font-size:18px;font-weight:900;color:#fff">'+(stepDone+1)+'</div>'
    + '<div style="font-size:9px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.8px">of 8</div>'
    + '</div></div>'
    /* Summary lines */
    + '<div style="padding:22px 26px">'
    + '<div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px">'
    + lines.map(function(l){
        return '<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:#F8FAFC;border-radius:9px;font-size:13px;color:#1E293B;line-height:1.5">'
          + '<span style="color:'+deptCol+';flex-shrink:0;margin-top:1px">▸</span><div>'+l+'</div></div>';
      }).join('')
    + '</div>'
    + '<button onclick="stageSummaryDone()" style="display:block;width:100%;padding:14px;background:'+deptCol+';border:none;border-radius:11px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:Inter,sans-serif;letter-spacing:-.2px">→ Continue to '+(nextLbl==='Done'?'Completion':nextLbl)+'</button>'
    + '</div></div>';

  window._stageSummaryCb = cb;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) stageSummaryDone(); });
  /* Auto-advance after 6s if nurse doesn't click */
  window._stageSummaryTimer = setTimeout(stageSummaryDone, 6000);
}

function stageSummaryDone() {
  clearTimeout(window._stageSummaryTimer);
  var el = document.getElementById('stage-summary-modal');
  if (el) el.remove();
  if (typeof window._stageSummaryCb === 'function') {
    var fn = window._stageSummaryCb;
    window._stageSummaryCb = null;
    fn();
  }
}
window.stageSummaryDone = stageSummaryDone;


/* ═══════════════════════════════════════════════════════════════
   2. REAL-TIME TRANSFER FLASH NOTIFICATION
   Shows a prominent animated banner when a patient moves dept.
   ═══════════════════════════════════════════════════════════════ */
function showTransferFlash(firstName, lastName, fromDept, toDept) {

  el.innerHTML =
    '<div style="background:#0B1F3A;border:2px solid '+cols[toDept]+';border-radius:14px;padding:14px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 40px rgba(0,0,0,.5);min-width:340px;max-width:90vw">'

    + '<div style="font-size:13px;font-weight:800;color:#fff">'
    + firstName + ' ' + lastName + ' — Patient Transfer'
    + '</div>'
    + '<div style="font-size:11px;color:'+cols[toDept]+';margin-top:2px;font-weight:600">'
    + names[fromDept] + ' → ' + names[toDept]
    + '</div></div>'
    + '<div style="width:10px;height:10px;border-radius:50%;background:'+cols[toDept]+';box-shadow:0 0 0 0 '+cols[toDept]+';animation:radarPing 1.2s ease infinite;flex-shrink:0"></div>'

  document.body.appendChild(el);

}

/* ═══════════════════════════════════════════════════════════════
   3. IP INTRA-FACILITY TRANSFER MODULE
   A separate 5-step workflow: Prepare → Ambulance → Handover →
   Receiving → Confirmation
   ═══════════════════════════════════════════════════════════════ */
var S_IFT = {
  active: false,
  step: 0,  /* 0-4 */
  patient: null,
  fromFacility: 'HMC Main Hospital',
  toFacility: 'HMC Satellite — Al Wakra',
  reason: '',
  vitalsOnDeparture: {},
  ambulanceCrew: '',
  departureTime: '',
  arrivalTime: '',
  handoverGiven: false,
  receivingNurse: '',
  confirmed: false
};

var IFT_STEPS = [
  { id: 'prepare',    lbl: 'Prepare Patient',      icon: '\uD83D\uDCCB' },
  { id: 'ambulance',  lbl: 'Ambulance Handover',   icon: '\uD83D\uDE91' },
  { id: 'transit',    lbl: 'In Transit',            icon: '\uD83D\uDEE3\uFE0F' },
  { id: 'receiving',  lbl: 'Receiving Facility',   icon: '\uD83C\uDFE5' },
  { id: 'confirm',    lbl: 'Transfer Confirmed',   icon: '\u2705' }
];

function startIFT(ptId) {
  var ptList = PT_IP;
  var pt2 = ptList.filter(function(p){ return p.id === ptId; })[0] || ptList[0];
  S_IFT.active = true;
  S_IFT.step = 0;
  S_IFT.patient = pt2;
  S_IFT.reason = '';
  S_IFT.vitalsOnDeparture = {};
  S_IFT.ambulanceCrew = '';
  S_IFT.departureTime = '';
  S_IFT.arrivalTime = '';
  S_IFT.handoverGiven = false;
  S_IFT.receivingNurse = '';
  S_IFT.confirmed = false;
  S.view = 'ift';
  render();
}
window.startIFT = startIFT;

function bIFT() {
  var p = S_IFT.patient || {};
  var step = S_IFT.step;
  var col = '#14B8A6';

  var h = '<div style="min-height:100vh;background:#F1F5F9;font-family:Inter,-apple-system,sans-serif">';

  /* Top bar */
  h += '<div style="background:#0B1F3A;padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100">';
  h += '<div style="font-size:22px">\uD83D\uDE91</div>';
  h += '<div><div style="font-size:15px;font-weight:800;color:#fff">IP Intra-Facility Transfer</div>';
  h += '<div style="font-size:11px;color:rgba(255,255,255,.45)">' + S_IFT.fromFacility + ' → ' + S_IFT.toFacility + '</div></div>';
  h += '<div style="flex:1"></div>';
  h += '<button onclick="S.view=\'patients\';S_IFT.active=false;render()" style="padding:7px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);cursor:pointer;font-family:Inter,sans-serif">\u2190 Back to Board</button>';
  h += '</div>';

  /* Progress stepper */
  h += '<div style="background:#fff;border-bottom:1px solid #E2E8F0;padding:16px 28px">';
  h += '<div style="display:flex;align-items:center;max-width:700px;margin:0 auto">';
  IFT_STEPS.forEach(function(s, i) {
    var done = i < step, active = i === step;
    var c = done ? col : active ? col : '#CBD5E1';
    if (i > 0) h += '<div style="flex:1;height:2px;background:' + (done?col:'#E2E8F0') + ';margin:0 4px"></div>';
    h += '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0">';
    h += '<div style="width:36px;height:36px;border-radius:50%;background:' + (done||active?col:'#F1F5F9') + ';border:2px solid '+c+';display:flex;align-items:center;justify-content:center;font-size:'+(done?'14px':'15px')+'">';
    h += done ? '\u2713' : s.icon;
    h += '</div>';
    h += '<div style="font-size:9px;font-weight:' + (active?'700':'500') + ';color:' + (active?col:done?'#64748B':'#94A3B8') + ';text-align:center;max-width:60px;line-height:1.3">' + s.lbl + '</div>';
    h += '</div>';
  });
  h += '</div></div>';

  /* Patient strip */
  h += '<div style="max-width:800px;margin:20px auto 0;padding:0 20px">';
  h += '<div style="background:#fff;border-radius:12px;border:1px solid #E5E9EF;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px">';
  h += '<div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,'+col+',#0B7A6A);display:flex;align-items:center;justify-content:center;font-size:20px">\uD83D\uDC64</div>';
  h += '<div style="flex:1"><div style="font-size:15px;font-weight:800;color:#0B1F3A">' + (p.first||'') + ' ' + (p.last||'') + '</div>';
  h += '<div style="font-size:12px;color:#64748B;margin-top:2px">' + (p.mrn||'') + ' \u00b7 ' + (p.dx||'') + ' \u00b7 ' + (p.loc||'') + '</div></div>';
  h += '<div style="text-align:right"><div style="font-size:10px;font-weight:700;color:'+col+';text-transform:uppercase;letter-spacing:.8px">Transferring To</div>';
  h += '<div style="font-size:12px;font-weight:700;color:#0B1F3A;margin-top:2px">' + S_IFT.toFacility + '</div></div>';
  h += '</div>';

  /* Step content */
  h += '<div style="background:#fff;border-radius:14px;border:1px solid #E5E9EF;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)">';

  if (step === 0) { /* PREPARE */
    h += '<div style="padding:20px 24px;background:linear-gradient(135deg,#E8F8F5,#F0FDF9);border-bottom:1.5px solid rgba(20,184,166,.2)">';
    h += '<div style="font-size:16px;font-weight:800;color:#0B1F3A;margin-bottom:4px">\uD83D\uDCCB Step 1 — Prepare Patient for Transfer</div>';
    h += '<div style="font-size:12px;color:#64748B">Complete all pre-transfer checks before calling the ambulance.</div></div>';
    h += '<div style="padding:20px 24px;display:flex;flex-direction:column;gap:12px">';
    /* Checklist items */
    [
      {id:'ift_consent',lbl:'Informed consent obtained and documented',why:'Patient has the right to know they are being transferred and why.'},
      {id:'ift_summary',lbl:'Clinical summary letter prepared and signed by physician',why:'Receiving facility requires complete clinical history. Never transfer without documentation.'},
      {id:'ift_meds',lbl:'Medications packed with 24-hour supply and MAR copy',why:'Medication continuity is critical. Gaps cause adverse events at receiving facility.'},
      {id:'ift_iv',lbl:'IV access patent and flushed — site, gauge, date labelled',why:'Ambulance crew needs reliable access. Document everything on the transfer form.'},
      {id:'ift_vitals',lbl:'Departure vitals recorded and documented below',why:'Establishes a baseline. Any deterioration in transit can be measured against this.'}
    ].forEach(function(item) {
      var checked = !!(S_IFT[item.id]);
      h += '<div onclick="S_IFT[\''+item.id+'\']=!S_IFT[\''+item.id+'\'];render()" style="display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:10px;border:1.5px solid '+(checked?col:'#E5E9EF')+';background:'+(checked?'rgba(20,184,166,.05)':'#FAFBFC')+';cursor:pointer;transition:all .12s">';
      h += '<div style="width:22px;height:22px;border-radius:6px;border:2px solid '+(checked?col:'#CBD5E1')+';background:'+(checked?col:'#fff')+';display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;margin-top:1px">'+(checked?'\u2713':'')+'</div>';
      h += '<div><div style="font-size:13px;font-weight:600;color:#0B1F3A">' + item.lbl + '</div>';
      h += '<div style="font-size:11px;color:#64748B;margin-top:2px">' + item.why + '</div></div></div>';
    });
    /* Reason for transfer */
    h += '<div style="margin-top:4px"><label style="font-size:12px;font-weight:700;color:#0B1F3A;display:block;margin-bottom:6px">Clinical reason for transfer</label>';
    h += '<textarea id="ift-reason" oninput="S_IFT.reason=this.value" placeholder="State the clinical reason, receiving team, and what the patient requires at the destination facility…" style="width:100%;min-height:80px;padding:11px 13px;border:1.5px solid #E5E9EF;border-radius:9px;font-size:13px;font-family:Inter,sans-serif;color:#0B1F3A;resize:vertical;outline:none;box-sizing:border-box">' + (S_IFT.reason||'') + '</textarea></div>';
    h += '</div>';
    var allChecked = S_IFT.ift_consent && S_IFT.ift_summary && S_IFT.ift_meds && S_IFT.ift_iv && S_IFT.ift_vitals && S_IFT.reason && S_IFT.reason.length > 10;
    h += '<div style="padding:16px 24px;background:#F8FAFC;border-top:1px solid #F1F5F9">';
    h += '<button onclick="if(window.iftCanProceed&&iftCanProceed(0))iftNext()" style="display:block;width:100%;padding:13px;background:'+(allChecked?col:'#CBD5E1')+';border:none;border-radius:10px;font-size:14px;font-weight:700;color:#fff;cursor:'+(allChecked?'pointer':'not-allowed')+';font-family:Inter,sans-serif">Call Ambulance \u2192</button>';
    h += '</div>';

  } else if (step === 1) { /* AMBULANCE HANDOVER */
    h += '<div style="padding:20px 24px;background:linear-gradient(135deg,#FEF3C7,#FFFBEB);border-bottom:1.5px solid #FCD34D">';
    h += '<div style="font-size:16px;font-weight:800;color:#0B1F3A;margin-bottom:4px">\uD83D\uDE91 Step 2 — Ambulance Crew Handover</div>';
    h += '<div style="font-size:12px;color:#64748B">Complete SBAR to the ambulance crew before patient leaves the ward.</div></div>';
    h += '<div style="padding:20px 24px;display:flex;flex-direction:column;gap:14px">';
    h += '<div><label style="font-size:12px;font-weight:700;color:#0B1F3A;display:block;margin-bottom:6px">Ambulance crew name / unit number</label>';
    h += '<input id="ift-crew" oninput="S_IFT.ambulanceCrew=this.value" value="'+(S_IFT.ambulanceCrew||'')+'" placeholder="e.g. Paramedic Ahmed — Unit 7" style="width:100%;padding:11px 13px;border:1.5px solid #E5E9EF;border-radius:9px;font-size:13px;font-family:Inter,sans-serif;box-sizing:border-box;outline:none"/></div>';
    h += '<div><label style="font-size:12px;font-weight:700;color:#0B1F3A;display:block;margin-bottom:6px">Departure time</label>';
    h += '<input id="ift-deptime" type="time" oninput="S_IFT.departureTime=this.value" value="'+(S_IFT.departureTime||'')+'" style="width:100%;padding:11px 13px;border:1.5px solid #E5E9EF;border-radius:9px;font-size:13px;font-family:Inter,sans-serif;box-sizing:border-box;outline:none"/></div>';
    /* SBAR reminder */

}

function bPC_labs(labs){
  if(!labs||!labs.length)return '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No lab results available for this scenario.</div>';
  var out='<div style="margin-bottom:12px">';
  out+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
  out+='<div style="font-size:14px;font-weight:700;color:var(--ink)">Lab Results</div>';
  var critCount=labs.filter(function(l){return l.crit||l.f==='H';}).length;
  if(critCount>0)out+='<span style="background:var(--redl);color:var(--red);border:1px solid rgba(220,38,38,.2);border-radius:5px;padding:3px 9px;font-size:11px;font-weight:700">'+critCount+' CRITICAL</span>';
  out+='</div>';
  out+='<table class="tbl"><thead><tr><th>Test</th><th>Result</th><th>Ref</th><th>Status</th><th>Interpretation</th></tr></thead><tbody>';
  labs.forEach(function(l){
    var flagCls=l.f==='H'?'fH':l.f==='L'?'fL':'fN';
    var isCrit=l.crit||l.f==='H';
    out+='<tr style="background:'+(isCrit?'var(--redl)':'#fff')+'">';
    out+='<td style="font-weight:600;color:var(--ink);font-size:12px">'+(isCrit?'<span class="hrtag">CRIT</span> ':'')+l.n+'</td>';
    out+='<td><span class="'+flagCls+'">'+l.v+' '+l.u+'</span></td>';
    out+='<td style="color:var(--muted);font-size:11px">'+l.r+'</td>';
    out+='<td><span class="badge '+(l.s==='Resulted'?'bc':l.s==='Pending'?'bp':'bd')+'">'+l.s+'</span></td>';
    out+='<td style="font-size:11px;color:var(--slate);max-width:200px">'+l.i+'</td>';
    out+='</tr>';
  });
  out+='</tbody></table></div>';
  return out;
}

      Wraps bIPBoard() so any patient with isSDA:true gets a small live
      countdown pill next to their normal row content. Since bIPBoard()
      returns a full HTML string, we inject the badge via a lightweight
      string marker rather than touching your original table-building

(function patchIPBoardForCountdownBadge(){
  var _origIPBoard = window.bIPBoard;
  if (typeof _origIPBoard !== 'function') {
    console.warn('[BurakCascade v3.1] bIPBoard not found — countdown badges skipped.');
    return;
  }
  window.bIPBoard = function () {
    var raw = _origIPBoard();
    var sdaPatients = (window.PT_IP || []).filter(function (p) { return p.isSDA && p.sdaStartTs; });
    if (!sdaPatients.length) return raw;

    sdaPatients.forEach(function (p) {
      var badgeId = 'sda-badge-' + p.mrn.replace(/[^a-z0-9]/gi, '');
      var badge = '<span id="' + badgeId + '" data-sda-start="' + p.sdaStartTs + '" '
        + 'style="display:inline-flex;align-items:center;gap:4px;background:rgba(107,33,168,.12);'
        + 'border:1px solid rgba(107,33,168,.3);border-radius:6px;padding:2px 8px;font-size:10px;'
        + 'font-weight:700;color:#6B21A8;margin-left:6px;font-family:monospace;white-space:nowrap">'
        + '⏱ --:--:--</span>';

      /* Insert the badge right after the patient's name in their row.
         We match on the MRN, which is unique and always rendered. */
      var mrnMarker = p.mrn;
      var idx = raw.indexOf(mrnMarker);
      if (idx >= 0) {
        /* Find the end of the nearest closing </div> after the MRN text
           so the badge sits on the same line without breaking layout. */
        var divEnd = raw.indexOf('</div>', idx);
        if (divEnd >= 0) {
          raw = raw.slice(0, divEnd) + badge + raw.slice(divEnd);
        }
      }
    });

    _startSDABadgeTicker();
    return raw;
  };
})();

function _startSDABadgeTicker() {
  if (window._sdaBadgeInterval) clearInterval(window._sdaBadgeInterval);
  window._sdaBadgeInterval = setInterval(function () {
    var badges = document.querySelectorAll('[id^="sda-badge-"]');
    if (!badges.length) { clearInterval(window._sdaBadgeInterval); window._sdaBadgeInterval = null; return; }
    badges.forEach(function (el) {
      var startTs = parseInt(el.getAttribute('data-sda-start'), 10);
      if (!startTs) return;
      var elapsed = Math.floor((Date.now() - startTs) / 1000);
      var remain = Math.max(86400 - elapsed, 0);
      var hh = Math.floor(remain / 3600), mm = Math.floor((remain % 3600) / 60), ss = remain % 60;
      var str = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
      el.textContent = '⏱ ' + str;

    });
  }, 1000);
}

   Teaches the real clinical distinction between two medication pathways:

     CLOSED-LOOP (Pyxis)   — drug is in an automated dispensing cabinet
                              on the unit. Scan wristband → scan drug →
                              administer immediately. Used in ED resus
                              and IP ward stock medications.

     PHARMACY ORDER         — drug is NOT on the unit. Goes to pharmacy,
                              gets dispensed, then collected/delivered,
                              THEN administered (or patient takes the
                              script home, e.g. OPD discharge meds).
                              Used almost always in OPD, and for IP
                              non-stock or specialist medications.

   Every medication on the MAR now carries a dispensingMode flag:
     'closed_loop' | 'pharmacy'
   Defaults: OPD meds default to 'pharmacy'. ED/IP meds default to
   'closed_loop'. A toggle on each medication row lets the trainee
   switch modes per-drug for teaching flexibility — e.g. demonstrating
   why a ward stock antibiotic is closed-loop but a discharge
   prescription is not.

   Your existing bPyxis() now ONLY shows closed_loop medications.
   Your existing bPC_pharmacy() now ONLY shows pharmacy medications,
   PLUS a new 3-step sub-workflow: Dispense → Collect/Deliver →
   Administer, mirroring the real-world pharmacy turnaround.

   REQUIRES: v3 through v3.5 must already be installed.

   INSTALL: paste this block directly AFTER the v3.5 patch (after its
   console.log line), still before the final boot render().
   ═══════════════════════════════════════════════════════════════════════ */


/* ─────────────────────────────────────────────────────────────────────
   1. ASSIGN DEFAULT DISPENSING MODE — runs once per encounter, reading
      your existing sc().mar array and tagging each medication. We hook
      this into beginEnc() (already wrapped by v3) by wrapping it once
      more — chaining cleanly after v3's wrap.
   ───────────────────────────────────────────────────────────────────── */
function _assignDispensingModes() {
  var sc2 = typeof sc === 'function' ? sc() : null;
  if (!sc2 || !sc2.mar) return;
  var defaultMode = (window.S && S.dept === 'opd') ? 'pharmacy' : 'closed_loop';
  sc2.mar.forEach(function (m, i) {
    if (!m.dispensingMode) {
      /* PRN/STAT high-acuity meds stay closed-loop even in mixed
         scenarios — this mirrors real practice (e.g. GTN, morphine
         are never pharmacy-routed in an emergency). */
      m.dispensingMode = (m.due === 'STAT' || m.due === 'PRN') ? 'closed_loop' : defaultMode;
    }
    if (!m.pharmacyStage) m.pharmacyStage = 'pending'; /* pending | dispensed | collected | administered */
  });
}

/* Reuses the exact contraindication logic your real bCLPanel() already
   has — kept deliberately in sync so "checked at order time" and
   "checked at administration time" agree with each other. */
function checkOrderAllergyConflict(drugName, patientAllergy) {
  if (!drugName || !patientAllergy) return null;
  var alok = patientAllergy.indexOf('NKDA') >= 0;
  if (alok) return null;
  var d = drugName.toLowerCase(), a = patientAllergy.toLowerCase();
  var conflict =
    (a.indexOf('penicillin') >= 0 && (d.indexOf('amoxicillin') >= 0 || d.indexOf('co-amoxiclav') >= 0 || d.indexOf('augmentin') >= 0)) ||
    (a.indexOf('aspirin') >= 0 && d.indexOf('aspirin') >= 0) ||
    (a.indexOf('morphine') >= 0 && d.indexOf('morphine') >= 0) ||
    (a.indexOf('nsaid') >= 0 && (d.indexOf('ibuprofen') >= 0 || d.indexOf('diclofenac') >= 0 || d.indexOf('naproxen') >= 0)) ||
    (a.indexOf('sulfa') >= 0 && d.indexOf('sulfa') >= 0) ||
    (a.indexOf('cephalosporin') >= 0 && d.indexOf('cef') >= 0);
  return conflict ? { allergy: patientAllergy } : null;
}

    showToast('Enter an order name before saving.', '#DC2626');

  var conflict = checkOrderAllergyConflict(st.name, p.allergy);
  if (conflict && !st.overrideReason) {
    showToast('⚠️ Contraindication — acknowledge with a documented reason before saving.', '#DC2626');
    return;
  }

  if (st.type === 'Medication') {
    if (!sc2.orders) sc2.orders = [];
    sc2.orders.push({ n: st.name + (st.dose ? ' ' + st.dose : '') + (st.route ? ' ' + st.route : ''), type: 'Medication', pri: st.priority });
    if (!sc2.mar) sc2.mar = [];
    sc2.mar.push({ n: st.name + (st.dose ? ' ' + st.dose : ''), route: st.route || 'Oral', ro: st.route || 'Oral', due: st.priority === 'STAT' ? 'STAT' : 'Routine', risk: !!conflict });
    if (typeof _assignDispensingModes === 'function') _assignDispensingModes();
  } else {
    if (!sc2.orders) sc2.orders = [];
    sc2.orders.push({ n: st.name, type: st.type, pri: st.priority });

  journeyLog(p.mrn, 'order', '📝', '#6366F1', 'Order created — ' + st.name, st.type + ' · ' + st.priority + (conflict ? ' · ⚠️ Allergy override documented: ' + st.overrideReason : ''));
  if (conflict) {

  if (typeof logA === 'function') logA('Order created', st.name + ' (' + st.type + ')', 'ok');
  if (typeof boostPSI === 'function') boostPSI(2);
  showToast('✓ Order saved — ' + st.name, conflict ? '#D97706' : '#1A7F54');

  ORDER_ENTRY_STATE.name = ''; ORDER_ENTRY_STATE.dose = ''; ORDER_ENTRY_STATE.route = ''; ORDER_ENTRY_STATE.overrideReason = '';
  render();

    h += '<div><label style="font-size:11px;font-weight:700;color:#0B1F3A;display:block;margin-bottom:5px">Route</label><input oninput="updateOrderEntryField(\'route\',this.value)" value="' + st.route + '" placeholder="e.g. IV" style="width:100%;padding:9px 12px;border:1.5px solid #E5E9EF;border-radius:8px;font-size:13px;font-family:Inter,sans-serif;box-sizing:border-box;outline:none"/></div>';
    h += '</div>';
  }

  h += '<label style="font-size:11px;font-weight:700;color:#0B1F3A;display:block;margin-bottom:5px">Priority</label>';
  h += '<div style="display:flex;gap:8px;margin-bottom:14px">';
  ['Routine', 'Urgent', 'STAT'].forEach(function (pri) {
    var sel = st.priority === pri;
    var col = pri === 'STAT' ? '#DC2626' : pri === 'Urgent' ? '#D97706' : '#1A7F54';
    h += '<div onclick="updateOrderEntryField(\'priority\',\'' + pri + '\');render()" style="flex:1;text-align:center;padding:7px;border-radius:7px;border:1.5px solid ' + (sel ? col : '#E5E9EF') + ';background:' + (sel ? col + '15' : '#fff') + ';color:' + (sel ? col : '#64748B') + ';font-size:11px;font-weight:700;cursor:pointer">' + pri + '</div>';
  });
  h += '</div>';

  if (conflict) {
    h += '<div style="background:#FEF2F2;border:2px solid #DC2626;border-radius:10px;padding:13px 15px;margin-bottom:14px">';
    h += '<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px">';
    h += '<span style="font-size:20px;flex-shrink:0">🚨</span>';
    h += '<div><div style="font-size:13px;font-weight:800;color:#991B1B">Contraindication detected</div>';
    h += '<div style="font-size:12px;color:#B91C1C;margin-top:3px;line-height:1.6">Patient has documented allergy: <strong>' + p.allergy + '</strong>. This order cannot be saved without an acknowledged override.</div></div></div>';
    h += '<label style="font-size:11px;font-weight:700;color:#991B1B;display:block;margin-bottom:5px">Override reason (required)</label>';
    h += '<textarea oninput="updateOrderEntryField(\'overrideReason\',this.value)" placeholder="Document clinical justification for proceeding despite the documented allergy…" style="width:100%;min-height:55px;padding:9px 12px;border:1.5px solid #FCA5A5;border-radius:8px;font-size:12px;font-family:Inter,sans-serif;color:#0B1F3A;resize:vertical;outline:none;box-sizing:border-box">' + st.overrideReason + '</textarea>';
    h += '</div>';
  } else if (st.name && p.allergy && p.allergy.indexOf('NKDA') < 0) {
    h += '<div style="background:#F0FDF4;border:1.5px solid #BBF7D0;border-radius:9px;padding:10px 13px;margin-bottom:14px;font-size:11px;color:#166534;display:flex;gap:8px;align-items:center"><span style="font-size:15px">✅</span>No conflict detected against documented allergy (' + p.allergy + ').</div>';
  }

  var canSave = st.name && st.name.trim() && (!conflict || (st.overrideReason && st.overrideReason.trim()));
  h += '<button onclick="' + (canSave ? 'submitNewOrder()' : '') + '" style="width:100%;padding:12px;border:none;border-radius:10px;background:' + (canSave ? (conflict ? '#D97706' : '#6366F1') : '#CBD5E1') + ';color:#fff;font-size:13px;font-weight:700;cursor:' + (canSave ? 'pointer' : 'not-allowed') + ';font-family:Inter,sans-serif">' + (conflict ? '⚠️ Save With Override' : '✓ Save Order') + '</button>';
  h += '</div></div>';
  return h;
}
window.bOrderEntryForm = bOrderEntryForm;

/* ─────────────────────────────────────────────────────────────────────
   C. UNIFIED PATIENT JOURNEY TIMELINE — new tab inside bPC()'s cascade
      ribbon, reading from PATIENT_JOURNEY[mrn]. Also auto-logs events
      from v3.6's dispensing pipeline and v3.4's SDA pathway, by
      wrapping their key action functions one more time.
   ───────────────────────────────────────────────────────────────────── */
function bPatientJourney() {
  var p = typeof pt === 'function' ? pt() : {};
  var events = (p.mrn && PATIENT_JOURNEY[p.mrn]) || [];
  var h = '';

  h += '<div style="background:linear-gradient(135deg,#0B1F3A,#1A3A6B);border-radius:13px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px">';
  h += '<div style="font-size:28px;flex-shrink:0">🕓</div>';
  h += '<div style="flex:1"><div style="font-size:15px;font-weight:800;color:#fff">Patient Journey — ' + (p.first || '') + ' ' + (p.last || '') + '</div>';
  h += '<div style="font-size:12px;color:rgba(255,255,255,.55);margin-top:2px">' + events.length + ' event' + (events.length !== 1 ? 's' : '') + ' logged this session · every order, check, dispense and transfer in one chronological view</div></div></div>';

  if (!events.length) {
    h += '<div style="background:#fff;border-radius:12px;border:1px solid #E5E9EF;padding:32px;text-align:center;color:#94A3B8;font-size:13px">No events logged yet for this encounter.</div>';
    return h;
  }

  h += '<div style="background:#fff;border-radius:13px;border:1px solid #E5E9EF;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)">';
  h += '<div style="padding:14px 18px">';
  events.slice().reverse().forEach(function (ev, i) {
    h += '<div style="display:flex;gap:13px;' + (i < events.length - 1 ? 'padding-bottom:14px;' : '') + '">';
    h += '<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">';
    h += '<div style="width:34px;height:34px;border-radius:50%;background:' + ev.col + '15;border:1.5px solid ' + ev.col + '40;display:flex;align-items:center;justify-content:center;font-size:15px">' + ev.icon + '</div>';
    if (i < events.length - 1) h += '<div style="width:2px;flex:1;background:#F1F5F9;margin-top:4px"></div>';
    h += '</div>';
    h += '<div style="flex:1;padding-top:2px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">';
    h += '<span style="font-size:10px;font-weight:700;color:' + ev.col + ';font-family:monospace">' + ev.ts + '</span>';
    h += '<span style="background:' + ev.col + '12;color:' + ev.col + ';border-radius:4px;padding:1px 7px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px">' + ev.type + '</span></div>';
    h += '<div style="font-size:13px;font-weight:700;color:#0B1F3A">' + ev.title + '</div>';
    if (ev.detail) h += '<div style="font-size:11px;color:#64748B;margin-top:2px;line-height:1.5">' + ev.detail + '</div>';
    h += '</div></div>';
  });
  h += '</div></div>';
  return h;
}
window.bPatientJourney = bPatientJourney;

/* Inject the Journey tab into bPC()'s cascade ribbon — chains after
   every prior bPC() wrap (v3.2's SDA tab, v3.3's provenance badges). */
(function patchBPCForJourneyTab(){
  var _orig = window.bPC;
  if (typeof _orig !== 'function') { console.warn('[BurakCascade v3.7] bPC not found — Journey tab skipped.'); return; }
  window.bPC = function () {
    var raw = _orig();
    var active = window.S && S.pcTab === 'journey';
    var deptCol = (window.S && S.dept === 'ed') ? '#EF4444' : (window.S && S.dept === 'opd') ? '#3B82F6' : '#14B8A6';
    var tabBtn = '<button onclick="S.pcTab=\'journey\';render()" style="padding:6px 14px;border:1.5px solid #6366F1;border-radius:20px;background:' + (active ? '#6366F1' : '#fff') + ';color:' + (active ? '#fff' : '#6366F1') + ';font-size:11px;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;margin-bottom:10px;margin-right:6px;display:inline-block">🕓 Journey</button>';

    if (active) {
      var content = '<div style="background:#F8FAFC;border-radius:14px;padding:16px;margin-top:10px;margin-bottom:12px">' + bPatientJourney() + '</div>';
      var marker = '<div style="display:flex;background:#fff;border-radius:12px;';
      var idx = raw.indexOf(marker);
      if (idx >= 0) raw = raw.slice(0, idx) + tabBtn + content + raw.slice(idx);
      else raw = tabBtn + content + raw;
    } else {
      var marker2 = '<div style="display:flex;background:#fff;border-radius:12px;';
      var idx2 = raw.indexOf(marker2);
      if (idx2 >= 0) raw = raw.slice(0, idx2) + tabBtn + raw.slice(idx2);
    }
    return raw;
  };
})();

})();
